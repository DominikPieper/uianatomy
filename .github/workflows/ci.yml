name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is read from packageManager in package.json.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Other packages import from @uianatomy/shared/schema and ./bundle —
      # those subpath exports point at compiled dist/ output, so without an
      # initial shared build the typecheck step can't resolve them on a
      # cold runner.
      - name: Build shared (types for downstream typecheck)
        run: pnpm -F @uianatomy/shared build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Build runs the full pipeline: prebuild scripts (MCP server card,
      # agent-skills index), astro build, postbuild markdown rename,
      # astro-llms-md (.md sidecars + llms.txt), astro-og-canvas (71 PNGs),
      # astro-broken-links-checker (throwError: true — a real internal broken
      # link now fails this step instead of merely warning).
      - name: Build
        run: pnpm -r build

      # Cloudflare auto-deploys from main, so a Worker-bundling regression
      # would otherwise only surface at the deploy runner, outside any PR
      # signal. A dry-run bundles worker/index.ts against site/dist without
      # uploading or needing credentials, gating the deploy path in CI.
      - name: Worker deploy dry-run
        run: pnpm exec wrangler deploy --dry-run

      - name: Upload broken-links log on warning
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-log
          path: site/.link-checker/
          if-no-files-found: ignore
          retention-days: 14
