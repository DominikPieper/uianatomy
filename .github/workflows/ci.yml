name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is read from packageManager in package.json.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Build runs the full pipeline: prebuild scripts (MCP server card,
      # agent-skills index), astro build, postbuild markdown rename,
      # astro-llms-md (.md sidecars + llms.txt), astro-og-canvas (71 PNGs),
      # astro-broken-links-checker (fails the step if a real broken link
      # appears, since `throwError` is currently false the check warns —
      # but the consistency vitest already enforces vsRelated cross-refs).
      - name: Build
        run: pnpm -r build

      - name: Upload broken-links log on warning
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-log
          path: site/.link-checker/
          if-no-files-found: ignore
          retention-days: 14
