# Single-site config. Site = Astro static build. MCP server function deploys
# alongside; split into a second Netlify site once mcp-server has its own
# subdomain (see ADR-002, ADR-003).

[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter site build"
  publish = "site/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9.12.0"

[functions]
  directory = "mcp-server/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
