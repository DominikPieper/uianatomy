<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 24px; background: var(--paper-50); }
  .card { width: 652px; }
  .row { display: flex; gap: 12px; }
  .swatch { flex: 1; height: 88px; border-radius: 4px; border: 1px solid rgba(27,26,23,0.08);
    display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .swatch .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .swatch .hex  { font-family: var(--font-mono); font-size: 11px; opacity: .7; }
  .group-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-500); margin-bottom: 10px; }
</style></head>
<body>
<div class="card">
  <div class="group-label">Ink · text & rules</div>
  <div class="row">
    <div class="swatch" style="background:#1B1A17;color:#FBF8F2"><div class="name">ink-900</div><div class="hex">#1B1A17</div></div>
    <div class="swatch" style="background:#3B3833;color:#FBF8F2"><div class="name">ink-700</div><div class="hex">#3B3833</div></div>
    <div class="swatch" style="background:#6B665C;color:#FBF8F2"><div class="name">ink-500</div><div class="hex">#6B665C</div></div>
    <div class="swatch" style="background:#8C8678;color:#FBF8F2"><div class="name">ink-400</div><div class="hex">#8C8678</div></div>
    <div class="swatch" style="background:#B8B1A0;color:#1B1A17"><div class="name">ink-300</div><div class="hex">#B8B1A0</div></div>
  </div>
</div>
</body></html>
