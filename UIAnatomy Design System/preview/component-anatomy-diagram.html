<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:24px;background:var(--paper-50)}
  .card{width:652px}
  .group-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);margin-bottom:14px}
  /* Anatomy diagram block — the central component of the product */
  .diagram{position:relative;background:var(--paper-100);border:1px solid var(--paper-200);padding:32px 80px;border-radius:4px}
  .specimen{background:#FBF8F2;border:1px solid var(--paper-300);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:8px;max-width:340px;margin:0 auto}
  .ph{height:56px;background:var(--paper-100);border-radius:2px}
  .title{font-family:var(--font-serif);font-size:18px;color:var(--ink-900)}
  .sub{font-family:var(--font-sans);font-size:13px;color:var(--ink-500)}
  .footer{display:flex;gap:6px;margin-top:4px}
  .footer .b{padding:5px 10px;border-radius:2px;background:#1B1A17;color:#FBF8F2;font-family:var(--font-sans);font-size:12px}
  .footer .g{padding:5px 10px;border-radius:2px;border:1px solid var(--paper-300);font-family:var(--font-sans);font-size:12px;color:var(--ink-700)}
  .leader{position:absolute;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#B5471F;display:flex;align-items:center;gap:6px}
  .dot{width:5px;height:5px;border-radius:50%;background:#B5471F;flex:none}
  .line{height:1px;background:#B5471F;flex:1}
</style></head><body>
<div class="card">
  <div class="group-label">Anatomy diagram · labeled callouts on a specimen</div>
  <div class="diagram">
    <div class="specimen">
      <div class="ph"></div>
      <div class="title">Card title</div>
      <div class="sub">A short body excerpt that fills the secondary slot.</div>
      <div class="footer"><div class="b">Action</div><div class="g">Cancel</div></div>
    </div>
    <div class="leader" style="top:42px;left:0;width:80px;justify-content:flex-end"><span>Media</span><span class="line"></span><span class="dot"></span></div>
    <div class="leader" style="top:90px;right:0;width:80px"><span class="dot"></span><span class="line"></span><span>Header</span></div>
    <div class="leader" style="bottom:80px;left:0;width:80px;justify-content:flex-end"><span>Body</span><span class="line"></span><span class="dot"></span></div>
    <div class="leader" style="bottom:32px;right:0;width:80px"><span class="dot"></span><span class="line"></span><span>Footer</span></div>
  </div>
</div>
</body></html>
