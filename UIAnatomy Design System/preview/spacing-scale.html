<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:24px;background:var(--paper-50)}
  .card{width:652px}
  .group-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);margin-bottom:14px}
  .scale{display:flex;align-items:flex-end;gap:10px}
  .step{display:flex;flex-direction:column;align-items:center;gap:6px}
  .box{background:var(--ink-900);border-radius:2px}
  .tok{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);letter-spacing:.05em}
  .px{font-family:var(--font-mono);font-size:10px;color:var(--ink-400)}
</style></head><body>
<div class="card">
  <div class="group-label">Spacing scale · 4-base</div>
  <div class="scale">
    <div class="step"><div class="box" style="width:4px;height:4px"></div><div class="tok">s-1</div><div class="px">4</div></div>
    <div class="step"><div class="box" style="width:8px;height:8px"></div><div class="tok">s-2</div><div class="px">8</div></div>
    <div class="step"><div class="box" style="width:12px;height:12px"></div><div class="tok">s-3</div><div class="px">12</div></div>
    <div class="step"><div class="box" style="width:16px;height:16px"></div><div class="tok">s-4</div><div class="px">16</div></div>
    <div class="step"><div class="box" style="width:20px;height:20px"></div><div class="tok">s-5</div><div class="px">20</div></div>
    <div class="step"><div class="box" style="width:24px;height:24px"></div><div class="tok">s-6</div><div class="px">24</div></div>
    <div class="step"><div class="box" style="width:32px;height:32px"></div><div class="tok">s-8</div><div class="px">32</div></div>
    <div class="step"><div class="box" style="width:40px;height:40px"></div><div class="tok">s-10</div><div class="px">40</div></div>
    <div class="step"><div class="box" style="width:48px;height:48px"></div><div class="tok">s-12</div><div class="px">48</div></div>
    <div class="step"><div class="box" style="width:64px;height:64px"></div><div class="tok">s-16</div><div class="px">64</div></div>
  </div>
</div>
</body></html>
