<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 24px; background: var(--paper-50); }
  .card { width: 652px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; height: 70px; border-radius: 3px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid rgba(27,26,23,0.08); }
  .hex { font-size: 10px; opacity:.7; text-transform: none; letter-spacing: 0; }
  .group-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-500); margin-bottom: 12px; }
</style></head>
<body>
<div class="card">
  <div class="group-label">Semantic · annotation, mismatch, status</div>
  <div class="row">
    <div class="sw" style="background:#F0E3B8;color:#1B1A17">Highlight<div class="hex">#F0E3B8</div></div>
    <div class="sw" style="background:#A8392B;color:#FBF8F2">Error<div class="hex">#A8392B</div></div>
    <div class="sw" style="background:#5C7A3E;color:#FBF8F2">Success<div class="hex">#5C7A3E</div></div>
    <div class="sw" style="background:#FBF8F2;color:#1B1A17;border-color:#D9CDB2">Rule<div class="hex">#D9CDB2</div></div>
  </div>
</div>
</body></html>
