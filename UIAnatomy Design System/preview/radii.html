<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:24px;background:var(--paper-50)}
  .card{width:652px}
  .group-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);margin-bottom:14px}
  .row{display:flex;gap:16px}
  .swatch{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .demo{width:100%;height:60px;background:var(--paper-100);border:1px solid var(--paper-200)}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-500);letter-spacing:.05em}
</style></head><body>
<div class="card">
  <div class="group-label">Radii · small or none, never decorative</div>
  <div class="row">
    <div class="swatch"><div class="demo" style="border-radius:0"></div><div class="lbl">r-0 · 0px</div></div>
    <div class="swatch"><div class="demo" style="border-radius:2px"></div><div class="lbl">r-1 · 2px</div></div>
    <div class="swatch"><div class="demo" style="border-radius:4px"></div><div class="lbl">r-2 · 4px</div></div>
    <div class="swatch"><div class="demo" style="border-radius:6px"></div><div class="lbl">r-3 · 6px</div></div>
    <div class="swatch"><div class="demo" style="border-radius:999px"></div><div class="lbl">r-pill</div></div>
  </div>
</div>
</body></html>
