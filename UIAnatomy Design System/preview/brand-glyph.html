<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:32px;background:var(--paper-50)}
  .card{width:636px;display:flex;gap:24px;align-items:center}
  .tile{width:100px;height:100px;display:flex;align-items:center;justify-content:center;border:1px solid var(--paper-200)}
  .tile img{width:64px;height:64px}
  .light{background:var(--paper-50)}
  .paper{background:var(--paper-100)}
  .dark{background:#1B1A17}
  .accent{background:#FBEEDF}
  .meta{flex:1}
  .meta h3{margin:0 0 4px;font-family:var(--font-serif);font-size:20px;font-weight:500}
  .meta p{margin:0;color:var(--ink-500);font-size:13px}
</style></head><body>
<div class="card">
  <div class="tile light"><img src="../assets/glyph.svg" alt=""></div>
  <div class="tile paper"><img src="../assets/glyph.svg" alt=""></div>
  <div class="tile accent"><img src="../assets/glyph.svg" alt=""></div>
  <div class="meta">
    <h3>Glyph · Cross-section</h3>
    <p>A circle bisected by a hairline, with an accent leader and pin. The original direction.</p>
  </div>
</div>
</body></html>
