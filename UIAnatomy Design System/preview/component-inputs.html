<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:24px;background:var(--paper-50)}
  .card{width:652px}
  .group-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .lbl{font-family:var(--font-sans);font-size:13px;color:var(--ink-700);font-weight:500}
  .input{font-family:var(--font-sans);font-size:14px;padding:8px 11px;border:1px solid var(--paper-300);border-radius:3px;background:#FBF8F2;color:var(--ink-900)}
  .input:focus{outline:none;border-color:#1B1A17;box-shadow:0 0 0 3px rgba(27,26,23,.1)}
  .focused{border-color:#1B1A17;box-shadow:0 0 0 3px rgba(27,26,23,.1)}
  .err{border-color:#A8392B}
  .help{font-family:var(--font-sans);font-size:12px;color:var(--ink-500)}
  .err-msg{font-family:var(--font-sans);font-size:12px;color:#A8392B}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
</style></head><body>
<div class="card">
  <div class="group-label">Form inputs · default, focused, error</div>
  <div class="row">
    <div class="field">
      <span class="lbl">Component name</span>
      <input class="input" value="Card">
      <span class="help">Slot identifier; PascalCase</span>
    </div>
    <div class="field">
      <span class="lbl">Slot path</span>
      <input class="input focused" value="Card.Header.Title">
      <span class="help">Dot-separated chain</span>
    </div>
    <div class="field">
      <span class="lbl">ARIA role</span>
      <input class="input err" value="region">
      <span class="err-msg">Cannot be empty for landmark slots</span>
    </div>
    <div class="field">
      <span class="lbl">Token reference</span>
      <input class="input" value="--paper-100" placeholder="--token-name">
      <span class="help">CSS variable</span>
    </div>
  </div>
</div>
</body></html>
