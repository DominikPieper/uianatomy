<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:32px;background:var(--paper-50)}
  .card{width:636px}
  .group-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);margin-bottom:18px}
  .row{display:flex;gap:24px}
  .swatch{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px}
  .demo{width:100%;height:64px;background:var(--paper-50);border-radius:4px}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--ink-500);letter-spacing:.05em;text-align:center}
</style></head><body>
<div class="card">
  <div class="group-label">Shadow · paper has weight, not glow</div>
  <div class="row">
    <div class="swatch">
      <div class="demo" style="box-shadow:0 1px 0 rgba(27,26,23,.04),0 0 0 1px rgba(27,26,23,.06)"></div>
      <div class="lbl">shadow-1<br>resting card</div>
    </div>
    <div class="swatch">
      <div class="demo" style="box-shadow:0 1px 2px rgba(27,26,23,.06),0 0 0 1px rgba(27,26,23,.06)"></div>
      <div class="lbl">shadow-2<br>raised input</div>
    </div>
    <div class="swatch">
      <div class="demo" style="box-shadow:0 8px 24px -8px rgba(27,26,23,.18),0 0 0 1px rgba(27,26,23,.08)"></div>
      <div class="lbl">shadow-pop<br>menu, dialog</div>
    </div>
  </div>
</div>
</body></html>
