<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 24px; background: var(--paper-50); }
  .card { width: 652px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; height: 88px; border-radius: 4px; border: 1px solid rgba(27,26,23,0.08);
    display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .swatch .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .swatch .hex  { font-family: var(--font-mono); font-size: 11px; opacity: .7; }
  .group-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-500); margin-bottom: 10px; }
</style></head>
<body>
<div class="card">
  <div class="group-label">Paper · canvas tones</div>
  <div class="row">
    <div class="swatch" style="background:#FBF8F2;color:#1B1A17"><div class="name">paper-50</div><div class="hex">#FBF8F2</div></div>
    <div class="swatch" style="background:#F5F0E6;color:#1B1A17"><div class="name">paper-100</div><div class="hex">#F5F0E6</div></div>
    <div class="swatch" style="background:#ECE4D2;color:#1B1A17"><div class="name">paper-200</div><div class="hex">#ECE4D2</div></div>
    <div class="swatch" style="background:#D9CDB2;color:#1B1A17"><div class="name">paper-300</div><div class="hex">#D9CDB2</div></div>
  </div>
</div>
</body></html>
