  - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Roles/combobox_role
  - https://react-spectrum.adobe.com/react-aria/ComboBox.html
  - https://headlessui.com/react/combobox
  - https://www.downshift-js.com/
  - https://polaris.shopify.com/components/selection-and-input/combobox
  - https://carbondesignsystem.com/components/combo-box/usage/
  - https://m3.material.io/components/menus/overview
  - https://atlassian.design/components/combobox/examples
  - https://www.tpgi.com/the-anatomy-of-a-combobox/
  - https://inclusive-components.design/menus-menu-buttons/

