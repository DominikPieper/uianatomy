id: combobox
name: Combobox
description: >-
  A text input combined with a popup list of suggestions. The user
  types to filter, navigates with arrow keys, and selects an option
  to commit a value. Distinct from a Select (which has no text input)
  and from Autocomplete (which is a behavior, not a component name in
  most design systems).
intro: >-
  Combobox composes a text input with a popup listbox of
  suggestions — the canonical pattern for filtered selection
  from a long list. It implements the APG combobox role with
  autocomplete-list semantics: the input drives the list, the
  list reflects matches, and aria-activedescendant follows
  keyboard navigation while DOM focus stays on the input. The
  reference covers the six-edge state graph between closed,
  open, busy, and invalid; the four event payloads; the keyboard
  contract that distinguishes Tab from Enter from Escape; and
  the mobile-platform divergence where a native picker
  substitutes for the popup.

alternateNames:
  - 'Autocomplete'
  - 'Typeahead'

whenToUse:
  use: >-
    When the user selects a value from a finite or near-finite set
    that benefits from typeahead filtering. The text-input front
    differentiates it from `Select`: users can type to narrow before
    committing. Best for option counts of ~10–10,000 with optional
    async filter.
  avoid: >-
    For free-text input with no constrained set of values — that is
    `Input` or `SearchInput`. For a fixed short list (under ~10
    options) where typeahead adds no value — `Select`. For
    multi-tag input where the set is open-ended and tags are
    user-created — `TagInput`.
  vsRelated:
    - id: select
      difference: >-
        `Select` has no text-input front; the user picks from a
        fixed list via click or keyboard. `Combobox` adds a
        typeahead input plus async and strict modes. Migrate from
        Select to Combobox when the option count crosses the
        "scrollable popup is annoying" threshold (~10 items in
        practice).
    - id: search-input
      difference: >-
        `SearchInput` is free text submitted to a search engine;
        results appear separately. `Combobox` constrains output to
        a known set of options and commits on selection. They look
        similar; the distinguisher is whether the popup is a
        completion list (Combobox) or a results preview
        (SearchInput).
    - id: tag-input
      difference: >-
        `TagInput` accepts user-created tags or selections from a
        set and renders accumulated tags inline. `Combobox` with
        `variant: multi-select` is the constrained-set version;
        `TagInput` is the open-set version where users can create
        new tags.
    - id: text-input
      difference: >-
        `TextInput` accepts free-form text with no constrained set
        of values; `Combobox` filters and commits a value from a
        canonical list (or, in `creatable` variants, opts in to
        free text explicitly). Migrate TextInput to Combobox when
        a finite set of acceptable values exists and typeahead
        narrows the field meaningfully.
    - id: checkbox
      difference: >-
        `Checkbox` is a binary form field that toggles a single
        boolean per option (multi-select via a list of
        Checkbox); `Combobox` filters from a list with
        typeahead and commits one or more selected options to
        a single field. Bounded short option-sets (under ~10
        items) read better as a list of Checkbox; large
        unbounded sets need Combobox with multi-select for the
        filter-and-overflow handling.
    - id: textarea
      difference: >-
        `Textarea` accepts arbitrary multi-line free-form
        prose; `Combobox` commits one structured value from
        a constrained list with optional typeahead filter.
        Combobox uses a listbox popup; Textarea is a flat
        field. Use Combobox for structured single-value
        choice from a bounded set; Textarea for unstructured
        prose entry.
    - id: grid-pattern
      difference: >-
        `Combobox` is a single-input affordance with a
        listbox of selectable options (one-dimensional
        linear list); `Grid` is a 2D structure with cells
        in rows and columns (two-dimensional spatial
        navigation with roving-tabindex + arrow-key cell
        focus). Combobox suits "pick one from a list";
        Grid suits "navigate cell-by-cell through
        structured data". Their keyboard models diverge —
        Combobox uses ArrowDown / ArrowUp for list
        traversal, Grid uses all four arrows for cell
        navigation.

anatomy:
  - id: input
    required: true
    purpose: >-
      Single-line text field that accepts user input. The combobox's
      primary surface; carries the editable value, the focus, and the
      `aria-controls` relationship to the listbox.
    slotKind: interactive
    layout:
      row: 1
      col: 1
      span: 8
    figma:
      type: instance
      hint: Text input component instance; min-width drives the field size
    code:
      slot: input
      semantic: textbox
    a11y:
      hint: >-
        `role="combobox"`, `aria-expanded` reflecting popup state,
        `aria-controls` referencing the listbox id, and
        `aria-activedescendant` pointing at the currently-highlighted
        option when navigating with arrow keys. The input retains DOM
        focus throughout — focus never moves into the listbox.
    tokens:
      spacing:
        padding: spacing.compact
      radius:
        corner: radius.md
      typography:
        size: text.md
      color:
        background: color.surface.bg
        foreground: color.text.primary
        border: color.border.strong
        ring: color.border.focus

  - id: clear-button
    required: false
    purpose: >-
      Affordance to clear the current input value. Conventionally an
      "×" icon inside the trailing edge of the input; appears only
      when the input has a value.
    slotKind: interactive
    layout:
      row: 1
      col: 2
      span: 2
    figma:
      type: instance
      hint: Icon button instance; visibility bound to "has value" property
    code:
      slot: clear
      semantic: button
    a11y:
      hint: >-
        Real button with accessible name ("Clear" or "Clear search").
        Clicking returns focus to the input. Escape with the popup
        closed performs the same action (clear value), per APG.
    tokens:
      spacing:
        padding: spacing.tight
      radius:
        corner: radius.sm
      color:
        foreground: color.text.muted

  - id: trigger-button
    required: false
    purpose: >-
      Disclosure affordance that toggles the listbox without typing.
      Conventionally a chevron at the trailing edge of the input.
      Optional because some comboboxes only open on typing.
    slotKind: interactive
    layout:
      row: 1
      col: 3
      span: 2
    figma:
      type: instance
      hint: Icon button instance; chevron rotates with `aria-expanded`
    code:
      slot: trigger
      semantic: button
    a11y:
      hint: >-
        `tabindex="-1"` because the input owns focus; `aria-label`
        ("Show options"). Clicking toggles `aria-expanded` on the
        combobox input, not on this button.
    tokens:
      spacing:
        padding: spacing.tight
      radius:
        corner: radius.sm
      color:
        foreground: color.text.muted

  - id: listbox
    required: true
    purpose: >-
      Popup container that renders the option list. Floats above
      adjacent content; positioned relative to the input.
    slotKind: structural
    layout:
      floating:
        anchor: input
        position: below
        offset: 12
      span: 8
    figma:
      type: frame
      hint: Floating frame (overlay layer); width matches input by default
    code:
      slot: listbox
      semantic: listbox
    a11y:
      hint: >-
        `role="listbox"` and `id` referenced by the input's
        `aria-controls`. Listbox is rendered in the document but
        positioned via portal; do not move DOM focus into it.
    tokens:
      spacing:
        padding: spacing.tight
      radius:
        corner: radius.md
      color:
        background: color.surface.raised
        border: color.border.subtle
      elevation:
        shadow: elevation.lg

  - id: option
    required: true
    purpose: >-
      Individual selectable item inside the listbox. One anatomy slot
      describes the role; one component instance is rendered per
      filtered match.
    slotKind: interactive
    layout:
      parent: listbox
      row: 1
      span: full
      repeats: 3
    figma:
      type: instance
      hint: Option component instance with selected and highlighted variants
    code:
      slot: option
      semantic: option
    a11y:
      hint: >-
        `role="option"` and a unique `id` per option. The currently-
        highlighted option is referenced by the input's
        `aria-activedescendant`. Selected options have
        `aria-selected="true"`.
    tokens:
      spacing:
        padding: spacing.compact
      radius:
        corner: radius.sm
      typography:
        size: text.md
      color:
        foreground: color.text.primary

  - id: empty-state
    required: false
    purpose: >-
      Message rendered inside the listbox when no options match the
      current input value. Substitutes for the option list rather
      than appearing alongside it.
    slotKind: content
    layout:
      parent: listbox
      row: 2
      span: full
    figma:
      type: frame
      hint: Centered text with optional icon; visibility bound to "no matches" state
    code:
      slot: empty
      semantic: status
    a11y:
      hint: >-
        Announce the no-results state to assistive tech via
        `role="status"` (polite) on a live region inside the listbox,
        or via `aria-live="polite"` on the empty-state container.
        Avoid putting `role="option"` on the empty-state — it is not
        selectable.
    tokens:
      spacing:
        padding: spacing.comfortable
      typography:
        size: text.sm
      color:
        foreground: color.text.muted

axes:
  variants:
    - name: single-select
    - name: multi-select
    - name: creatable
  properties:
    - name: filterMode
      kind: enum
      values: [startsWith, contains, fuzzy, none]
    - {name: strict, kind: primitive, of: boolean}
    - {name: virtualised, kind: primitive, of: boolean}
    - {name: async, kind: primitive, of: boolean}
  states:
    interactive:
      - hover
      - focus-visible
      - active
      - disabled
    data:
      - closed
      - open
      - busy
      - invalid
    transitions:
      - from: closed
        to: open
        trigger: >-
          User types a printable character into the input, presses Down/Up
          arrow with the popup closed, or clicks the trigger button.
          `aria-expanded` flips to `true`; the listbox renders.
      - from: open
        to: closed
        trigger: >-
          User presses Escape with the popup open, clicks outside the
          combobox, or selects an option (single-select). `aria-expanded`
          flips to `false`; the listbox is removed.
      - from: open
        to: busy
        trigger: >-
          Typed input triggers an async filter request (`async: true`).
          Existing options are replaced with a loading affordance; an
          `aria-live` announcement signals the in-flight state.
      - from: busy
        to: open
        trigger: >-
          Async filter results return successfully. The option list
          re-renders with the new matches; an `aria-live` announcement
          signals the result count.
      - from: open
        to: invalid
        trigger: >-
          `strict: true` and the input blurs with a value that does not
          match any option. The combobox surfaces an inline error and
          sets `aria-invalid="true"` on the input.
      - from: invalid
        to: closed
        trigger: >-
          User clears the input or selects a valid option from a
          subsequently-opened listbox. `aria-invalid` is removed; the
          inline error is cleared.

mismatches:
  - figma: A combobox drawn as a text input with a dropdown panel rendered beneath, both inside the same Figma frame
    code: The listbox is rendered in a portal at the end of the document body, positioned with floating-ui or popper, and z-indexed above other content
    consequence: >-
      Designers approximate the listbox at "natural" stacking order,
      then are surprised when the implementation appears to "escape"
      its container (e.g., over a parent modal or sticky header).
    correct: >-
      Document the portal model in the canonical reference and the
      Figma file. Designers keep the dropdown rendered for review
      purposes but treat it as a floating layer; developers always
      portal in production.

  - figma: Each typeahead state (default / focused / open / loading / invalid / disabled) modeled as a Figma variant
    code: Data states (`open`, `busy`, `invalid`) toggled by the application; interactive states (`focus-visible`, `disabled`) are CSS pseudo-classes
    consequence: >-
      Variant explosion (6 states × 3 sizes × 2 widths = 36+ variants)
      and ambiguity about which states are mutually exclusive.
    correct: >-
      Reserve Figma variants for the structural variants (single /
      multi / creatable). States are documented once in the
      canonical reference, with a clear matrix of which are
      mutually exclusive.

  - figma: Multi-select rendered as chips inside the input field, drawn statically
    code: Chips are rendered dynamically; their addition / removal triggers re-layout that shifts the typing caret position
    consequence: >-
      The dynamic re-layout is invisible to the static Figma file;
      developers ship comboboxes whose typing behaviour breaks when
      chips wrap to a new row.
    correct: >-
      Document the multi-select chip behavior explicitly: chips wrap
      naturally, the input width is the remaining row space (with a
      minimum), and adding / removing a chip preserves the caret
      position. Annotate the Figma frame with a note about the
      dynamic re-layout.

  - figma: A "loading" spinner drawn inside the listbox as a permanent visual element
    code: The busy state replaces (not supplements) the option list while async results are in-flight, and is announced via a live region
    consequence: >-
      The spinner appears on every render in mocks, encouraging an
      implementation that always shows a spinner; assistive-tech users
      get no announcement when results arrive.
    correct: >-
      Treat busy as a data state replacing the option list. Document
      that an `aria-live` announcement fires when results change. The
      Figma file uses a state-toggle to show busy vs. loaded
      explicitly.

mistakes:
  - id: combobox-focus-into-listbox
    severity: blocker
    title: Arrow Down moves DOM focus into the listbox
    description: >-
      The implementation uses real `tabindex` on each option and
      moves focus there. Typing no longer routes to the input;
      Escape behaves unexpectedly.
    fix: >-
      Keep DOM focus on the input. Track the highlighted option
      with `aria-activedescendant` referencing the option's `id`.
      Arrow keys mutate the highlighted index; Enter selects.

  - id: combobox-no-aria-expanded
    severity: blocker
    title: '`aria-expanded` not toggled on open / close'
    description: >-
      The input misses `aria-expanded`, so screen readers cannot
      tell whether the popup is open. Users hear "combobox" with
      no state cue.
    fix: >-
      Set `aria-expanded="true"` when the listbox is open, `false`
      when closed. Keep this in sync with the `data-state` /
      transition state of the popup.

  - id: combobox-strict-without-feedback
    severity: major
    title: Strict mode silently rejects invalid input on blur
    description: >-
      The combobox is strict (must select from the list) but on
      blur with an unmatched value the input simply reverts. The
      user sees their typing disappear with no indication why.
    fix: >-
      On blur with an unmatched value, either snap to the best
      match (with an `aria-live` announcement) or surface an
      `invalid` state with an inline error referenced by
      `aria-describedby`. Never silently revert.

  - id: combobox-non-virtualised-large-list
    severity: major
    title: A list of 5,000 options renders all DOM nodes
    description: >-
      Every option is in the DOM whether visible or not. Open
      latency, memory, and screen-reader announcement all suffer.
    fix: >-
      Virtualise the option list when it exceeds ~200 items. Keep
      the visible window plus a small overscan in the DOM; emit a
      live-region count ("100 results") so users know the size
      without scrolling.

  - id: combobox-clear-button-tab-stop
    severity: minor
    title: Clear button appears in the keyboard tab order
    description: >-
      Tabbing from the input lands on the × button instead of
      moving past the combobox. The natural keyboard flow expects
      the clear affordance to be operable via the input itself.
    fix: >-
      Give the clear button `tabindex="-1"` and bind Escape on the
      input (when the popup is closed) to clear the value. The
      mouse user can still click the button; the keyboard user
      uses Escape.

frameworkMap:
  webComponents:
    structureMechanism: A `<ui-combobox>` host with named slots for `option`-bearing children and an internal portal for the listbox; floating positioning via the Popover API or floating-ui
    variantMechanism: attributes for variant (`single-select` / `multi-select` / `creatable`); CSS `[data-state="open"]` for transition styling
  react:
    structureMechanism: compound components (Radix `Combobox` does not exist as of 2026-04, but Headless UI `Combobox`, Downshift, or React Aria `useComboBox` follow the compound pattern with portal-based listbox)
    variantMechanism: props with discriminated unions for variant; controlled or uncontrolled value props; `data-state` attribute on the listbox element
  angularSignals:
    structureMechanism: Angular CDK Overlay + `cdk-listbox`; signal-based query, results, and selectedValue inputs / outputs
    variantMechanism: input<'single-select' | 'multi-select' | 'creatable'>(); input<'startsWith' | 'contains' | 'fuzzy'>() for filterMode
  vue:
    structureMechanism: Headless UI `<Combobox>` / `<ComboboxInput>` / `<ComboboxButton>` / `<ComboboxOptions>` / `<ComboboxOption>`
    variantMechanism: defineProps with literal-union types; `multiple` prop for multi-select

motion:
  reducedMotionFallback: instant
  durations:
    open: motion.duration.fast
    close: motion.duration.fast
    filter: motion.duration.instant
  easing: motion.easing.decelerate

responsive:
  breakpoints:
    - at: breakpoint.sm
      change: >-
        At and below, the floating listbox is replaced with the platform
        bottom-sheet picker (`<select>` on iOS, drawer-style native list
        on Android). The trigger button opens the OS-level surface; the
        in-page listbox markup is suppressed and `aria-controls` no
        longer applies. Filtering becomes synchronous (no async results)
        and the chip-input multi-select degrades to a count-display
        ("3 selected") in the input — comma-separated value lists in
        the input are explicitly anti-canon (the same rule the
        `Select` multi-select mismatch entry locks down) because the
        input would grow unboundedly and break the small-viewport
        layout it is supposed to rescue.
    - at: breakpoint.md
      change: >-
        Above this width, the floating listbox renders as authored —
        `aria-activedescendant` model, `aria-controls` reference, all
        framework-map mechanisms apply. Multi-select chips wrap inline
        with the input.

events:
  - name: inputChange
    payload: >-
      The current input string. Fires on every keystroke and on
      programmatic input mutation. May be empty after the user clears.
      During async filtering it remains the *typed* string, not the
      canonical selection label.
    frameworkNotes:
      webComponents: >-
        Native `input` event on the inner `<input>` slot, re-emitted on
        the `<ui-combobox>` host as `inputChange` with
        `event.detail = { value }`.
      react: >-
        `onInputValueChange(value: string)` (Headless UI `Combobox`)
        or `onInputChange(value)` (React Aria `useComboBox`,
        controlled).
      angularSignals: >-
        `output<string>('inputChange')`; pair with `[(inputValue)]`
        for two-way binding on the typed string.
      vue: >-
        `@update:inputValue` for `v-model:input-value` binding on the
        typed string, separate from the value `v-model`.

  - name: selectionChange
    payload: >-
      The selected value (single-select), the array of selected values
      (multi-select), or `null` / `[]` after clear. Always reflects the
      canonical value, not the input string. Does not fire while the
      user is typing — only when they commit a selection or clear.
    frameworkNotes:
      webComponents: >-
        `change` CustomEvent on the host with
        `event.detail = { value }`. Multi-select hosts may emit
        `event.detail = { value: T[] }` — document the shape per host.
      react: >-
        `onSelectionChange(key | Set<Key>)` (React Aria
        `useComboBox`) or `onChange(value)` (Headless UI). React Aria's
        set form is used for the multi-select variant.
      angularSignals: >-
        `output<T | T[] | null>('selectionChange')`; the union covers
        single, multi, and cleared paths.
      vue: >-
        `@update:modelValue` for `v-model`; multi-select uses an array
        `modelValue`.

  - name: openChange
    payload: >-
      Boolean. `true` when the listbox opens, `false` when it closes.
      Mirrors `aria-expanded` on the input. Fires on user-driven open
      (typing, arrow keys, trigger click) and on close paths (Escape,
      outside click, selection in single-select).
    frameworkNotes:
      webComponents: >-
        `openChange` CustomEvent with `event.detail = { open }`.
        Distinct from selection events so consumers that only care
        about popup lifecycle do not subscribe to selection.
      react: >-
        `onOpenChange(open: boolean)` (Headless UI, React Aria); fires
        on the same edge as `aria-expanded` flips.
      angularSignals: >-
        `output<boolean>('openChange')`; common pattern is `[(open)]`
        for controlled-from-parent scenarios.
      vue: >-
        `@update:open` for `v-model:open`; suppressed when the open
        state is computed and not externally controlled.

performance:
  - name: virtualisedListbox
    metric: option-count
    threshold: 200
    unit: items
    rationale: >-
      Above ~200 options, render virtualisation becomes necessary —
      open latency, memory footprint, and screen-reader announcement
      count all degrade beyond this threshold on commodity hardware.
      Below 200, all options can stay in the DOM with no measurable
      cost. The previously-prose "~200 items" hint in mistake
      `combobox-non-virtualised-large-list` is the canonical source
      of this threshold.
  - name: asyncFilterDebounce
    metric: keystroke-interval
    threshold: 150
    unit: ms
    rationale: >-
      Async filter requests should debounce keystrokes by ~150ms to
      avoid request floods on fast typers without feeling laggy. The
      150ms threshold sits below the 200ms perceptual threshold for
      input feedback while suppressing 80%+ of in-flight stale
      requests on a 60–80 wpm typer.

i18n:
  rtl:
    mirroring: >-
      Clear-button and trigger-button move from inline-end of the input
      to inline-start (visual right→left flip) via logical positioning.
      Chevron rotation is *not* mirrored — the rotation indicates
      open/closed state, not direction. Listbox aligns to the input's
      inline-start edge (same logical anchor in both directions). Input
      caret follows document direction; mixed-direction input (typing
      Hebrew into a Latin-default field) honours the input's own `dir`
      attribute.
  textExpansion: >-
    Option labels can grow significantly; listbox width matches the
    input by default and may need a max-width override when option
    labels exceed the input width. Truncation with ellipsis is the
    canonical fallback for option labels exceeding the listbox width;
    aria-label on the option provides the full text for SR users.
    Placeholder text is the riskiest expansion target — many locales'
    "Search…" translations exceed 30% length.

formIntegration:
  nativeElement: input
  name: >-
    The inner `<input>` carries the form `name` attribute; the combobox
    wrapper does not. Submitting a form writes the input's current
    value to FormData under the configured name — the typed string for
    free-input variants, the canonical value of the selected option
    for strict mode.
  submittedValue: >-
    Strict mode's selected option carries the canonical value (id /
    token), not the display label — see `formData` below for the
    full mechanics (multi-select entries, creatable and free-input
    variants).
  requiredAttr: true
  formData: >-
    Single-select strict mode submits the selected option's *canonical
    value* (id or token), not the *display label*. Multi-select
    variants submit one entry per selected value (multiple FormData
    entries with the same `name` key) to match `<select multiple>`
    native behaviour. Creatable variants submit user-created values
    verbatim.
  reset: >-
    `form.reset()` restores the inner input value to its
    `defaultValue`, closes the popup, and clears `aria-invalid` plus
    any `setCustomValidity()` message. Selected-value state held in
    framework state outside the DOM needs an explicit reset hook (an
    `onReset` listener on the parent form syncs the framework
    state).
  validation: >-
    The inner `<input>` participates in HTML5 validation: `required`
    triggers the `:invalid` pseudo-class when empty;
    `setCustomValidity('Pick a value from the list')` is the canonical
    hook for strict-mode "must select from list" enforcement on blur.
    The error message is announced via the inline-error pattern
    referenced through `aria-describedby`.
  bridges:
    react: >-
      Controlled via `value` plus `onChange` / `onValueChange`
      (varies by library — Radix uses `onValueChange`, React Aria
      uses `onSelectionChange`). React Hook Form / Formik integrate
      via `register("name")`; the inner `<input>` provides the
      ref-target for native form-state. Strict-mode validation hooks
      into the form-library's validate callback, returning the
      "select from list" message when the value is not in the
      option set.
    vue: >-
      Two-way binding via `v-model` for selected value (string or
      string[] for multi). VeeValidate / FormKit bind to the inner
      input via the field-name; PrimeVue Select / Naive UI Select as
      third-party precedents render the underlying `<input>` for
      form participation.
    angularSignals: >-
      ControlValueAccessor implementation maps `writeValue(value)` →
      selection.set(...). `formControl` / `formControlName` plus
      `Validators.required` drive validation; reactive-forms
      ng-touched + ng-dirty surface in template state. Strict-mode
      validation uses a custom validator that asserts value ∈
      options.
    webComponents: >-
      ElementInternals API for form-association: `static
      formAssociated = true` plus `internals.setFormValue(value)`.
      Falls back to a hidden native `<input>` slotted inside the
      shadow DOM when element-internals is not available; the
      hidden input mirrors selection state.

propertyMap:
  - figma: Variant
    code: variant
    kind: enum
    notes: Maps single-select / multi-select / creatable.
  - figma: Filter Mode
    code: filterMode
    kind: enum
    notes: startsWith / contains / fuzzy / none. Figma encodes for documentation; code drives the filter function selection.
  - figma: State
    code: 'data-state'
    kind: enum
    notes: >-
      Figma exposes closed / open / busy / invalid as a Variant for
      preview. In code these are data states toggled by application
      logic, mirrored on the host as a `data-state` attribute.
  - figma: Has Clear Button
    code: clear
    kind: boolean
    notes: Slot-visibility toggle; code conditionally renders the clear-button slot when the input has a value.
  - figma: Has Trigger Button
    code: trigger
    kind: boolean
    notes: Optional disclosure affordance; code conditionally renders the chevron trigger.
  - figma: Strict
    code: strict
    kind: boolean
  - figma: Async
    code: async
    kind: boolean
    notes: >-
      In Figma toggles the busy-state preview. In code marks the
      filter as async (results arrive via a Promise / observable).
  - figma: Virtualised
    code: virtualised
    kind: boolean
    notes: Documentation-only in Figma; in code drives the listbox-rendering strategy above ~200 options.
  - figma: Placeholder
    code: placeholder
    kind: text
a11yAcceptance:
  keyboardWalk:
    - keys: Tab
      expected: >-
        Focus enters the input. Focus never moves into the listbox even
        when the popup is open — DOM focus stays on the input throughout.
        From the input, Tab leaves the combobox entirely.
    - keys: ArrowDown / ArrowUp
      expected: >-
        With popup closed, opens the popup and highlights the first /
        last option. With popup open, moves the highlight to the next /
        previous option via `aria-activedescendant`. The input retains
        DOM focus.
    - keys: Enter
      expected: >-
        With popup open and an option highlighted, commits the
        highlighted option (input value updates, popup closes for
        single-select). With popup closed, behaves like default form
        submission if applicable.
    - keys: Escape
      expected: >-
        With popup open, closes the popup without changing the value.
        With popup already closed, clears the input value (matches APG
        guidance for combobox).
    - keys: Home / End
      expected: >-
        With popup open, highlights first / last option in the listbox.
        With popup closed, default text-input caret behavior (line start
        / end).
  announcements:
    - trigger: Input focused, popup closed
      expected: >-
        SR announces "<label>, combobox, expanded false" plus the current
        input value. The combobox role is on the input itself, not on a
        wrapping element.
    - trigger: Option highlighted via ArrowDown
      expected: >-
        SR announces "<option label>, <position> of <total>". The
        announcement is driven by `aria-activedescendant` updating to the
        highlighted option's id.
    - trigger: Async filter results return
      expected: >-
        A live region (`aria-live="polite"` inside the listbox or as a
        sibling) announces the result count — e.g. "12 results". Without
        this, SR users have no signal that filtering completed.
    - trigger: '`strict: true` blur with unmatched value'
      expected: >-
        Input gets `aria-invalid="true"`; the inline error referenced
        via `aria-describedby` is announced ("Pick a value from the
        list").
  axeCoreVersion: '4.10.2'
  axeRules:
    - aria-required-attr
    - aria-valid-attr-value
    - aria-roles
    - aria-input-field-name
    - color-contrast
    - focus-order-semantics

contracts:
  vocabularyDrift:
    - system: Material Design 3
      theirTerm: 'Autocomplete / Exposed dropdown menu'
      note: >-
        M3 splits canon combobox into "Autocomplete" (free text + filter) and
        "Exposed dropdown menu" (select-like, editable); both map to canon
        combobox variants along the `editable`/`autocomplete` axes.
    - system: Carbon
      theirTerm: ComboBox
      note: >-
        Carbon's `ComboBox` is the editable/filterable variant; its
        non-editable `Dropdown` maps to canon select, not combobox.
    - system: Polaris
      theirTerm: 'Combobox + Autocomplete'
      note: >-
        Polaris ships a low-level `Combobox` and a higher-level
        `Autocomplete` built on it; canon folds both into one component
        with axes for value-constraint and multi-select.
    - system: GOV.UK
      theirTerm: 'Accessible autocomplete'
      note: >-
        GOV.UK's standalone `accessible-autocomplete` progressively enhances
        a native `<select>` into the ARIA 1.2 combobox pattern canon
        describes — a select-backed, list-autocomplete variant.

