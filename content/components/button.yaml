id: button
name: Button
description: >-
  An interactive element that triggers an action when activated.
  Anchors most user-initiated state changes — submitting forms,
  opening dialogs, advancing flows. Distinct from a Link (which
  navigates) in semantic and visual treatment.
intro: >-
  Button is the canonical primitive for in-page actions — a
  focusable, activatable element backed by HTML button
  semantics. The five variants (primary, secondary, tertiary,
  ghost, destructive) capture the emphasis ladder; properties
  cover size, icon-only, full-width, and the html type
  attribute. Loading and pressed states extend the data axis.
  The reference catalogues the keyboard contract, the
  loading-guard for in-flight async actions, the accessible-name
  rules for icon-only buttons, and where Button stops and Link
  begins.

whenToUse:
  use: >-
    When the user needs to perform an action that triggers a state
    change, submits a form, or initiates a flow. Default activator
    for in-page mutations.
  avoid: >-
    For navigating to another page or external URL — that is `Link`,
    even when styled like a button. For binary on/off state — that
    is `Switch`. For opening a menu of multiple options — that is
    `MenuButton`.
  vsRelated:
    - id: link
      difference: >-
        `Link` navigates (changes the URL or opens a new tab); `Button`
        performs an action without navigation. Visual styling may
        converge but semantics never do — middle-click, "open in new
        tab", and copy-as-URL all rely on `<a>`.
    - id: menu-button
      difference: >-
        `MenuButton` opens a menu with multiple options and carries
        `aria-haspopup="menu"` plus `aria-expanded`. `Button` triggers
        a single action.
    - id: icon
      difference: >-
        `Icon` is the SVG-glyph primitive that may sit inside a Button
        as `icon-leading` or `icon-trailing`. Bare icons in clickable
        hosts are an anti-pattern — wrap in a `<button>` with an
        `aria-label` when the icon is the only label, so the host
        carries the activator semantics and the icon stays decorative.
    - id: switch
      difference: >-
        A toggle `Button` with `aria-pressed` is a momentary
        action that may be in a pressed state (toolbar formatting
        — bold / italic / underline); `Switch` is a setting-state
        control whose activation persists as configuration. Decision
        test: does activation perform a transient action with state
        memory (toggle button) or change a configuration setting
        that persists (Switch)?

anatomy:
  - id: root
    required: true
    purpose: >-
      The interactive surface itself. Carries the `<button>` element,
      the focus ring, the variant treatment, and the press affordance.
    slotKind: interactive
    layout:
      row: 1
      col: 1
      span: full
    figma:
      type: frame
      hint: Auto-layout horizontal frame; min-height per size token; padding from variant set
    code:
      slot: root
      semantic: button
    a11y:
      hint: >-
        Always render as `<button type="button">` (or `type="submit"`
        inside a form). Do not use `<div role="button">` — it loses
        the implicit form participation and key handling. Disabled
        state via the HTML `disabled` attribute (not `aria-disabled`)
        for buttons that should not receive focus; use `aria-disabled`
        only when the disabled button must remain focusable for
        assistive-tech announcement.
    tokens:
      spacing:
        padding: spacing.compact
        gap: spacing.tight
      radius:
        corner: radius.md
      color:
        background: color.accent.bg
        foreground: color.accent.fg
        border: color.border.subtle
        ring: color.border.focus
      elevation:
        shadow: elevation.sm
      typography:
        size: text.md
        weight: weight.semibold

  - $ref: icon-leading-text
    parent: root
    row: 2
    overrides:
      - slot: icon-leading
        type: overridden
        rationale: >-
          Button's accent-context coloring: the leading icon picks up
          the same accent foreground as the label so primary/secondary/
          destructive variants tint icon and text in lockstep.
        layout:
          row: 2
          col: 1
          span: 2
        tokens:
          color:
            foreground: color.accent.fg
      - slot: label
        type: overridden
        rationale: >-
          Button's label is semibold (Action emphasis) with normal
          tracking, set in the active accent foreground. Sub-anatomy's
          canonical text.md size cascades unchanged; only weight,
          tracking, foreground, and layout span are Button-specific.
        layout:
          row: 2
          col: 2
          span: 8
        tokens:
          typography:
            weight: weight.semibold
            tracking: tracking.normal
          color:
            foreground: color.accent.fg
      - slot: icon-trailing
        type: overridden
        rationale: >-
          Symmetric to icon-leading — accent-context foreground keeps
          the trailing chevron/state-icon tinted with the variant.
        layout:
          row: 2
          col: 3
          span: 2
        tokens:
          color:
            foreground: color.accent.fg

axes:
  variants:
    - name: primary
    - name: secondary
    - name: tertiary
    - name: ghost
    - name: destructive
  properties:
    - name: size
      kind: enum
      values: [sm, md, lg]
    - { name: iconOnly, kind: primitive, of: boolean }
    - { name: fullWidth, kind: primitive, of: boolean }
    - name: type
      kind: enum
      values: [button, submit, reset]
  states:
    interactive:
      - hover
      - focus-visible
      - active
      - disabled
    data:
      - loading
      - pressed

motion:
  reducedMotionFallback: instant
  durations:
    spinnerRotation: motion.duration.slow
    pressedFeedback: motion.duration.fast
  easing: motion.easing.standard

events:
  - name: click
    payload: >-
      Standard `MouseEvent` (or synthetic equivalent) fired on
      activation by pointer click, Enter, or Space. Suppressed
      when the button is in the `disabled` or `loading` data
      state — implementations guard the handler at the activation
      boundary so consumers never observe a click in those
      states.
    frameworkNotes:
      webComponents: >-
        Native `click` event on the host `<button>`; consumers
        listen with `addEventListener('click', …)`. The host
        prevents default activation while `loading` or `disabled`.
      react: >-
        `onClick(event: React.MouseEvent<HTMLButtonElement>)`.
        Loading-guard implemented by checking `props.loading`
        before invoking the supplied handler.
      angularSignals: >-
        `output<MouseEvent>('click')` or the host-binding
        `(click)` directive; loading-guard via `[disabled]`
        binding tied to the loading signal.
      vue: >-
        Native `@click` listener on the `<button>` element;
        wrapper components re-emit after the loading-guard.

mismatches:
  - figma: A button drawn as a styled `<div>` (or "rectangle with text") with click-through interactions in the prototype
    code: A real `<button>` element with native focus, native key handling (Enter / Space), and form participation
    consequence: >-
      Designers prototype clickable rectangles that work with mouse
      input but break for keyboard users when implemented literally.
      Developers shipping divs lose form submission and have to
      reimplement keyboard activation manually.
    correct: >-
      Document the button as a semantic element in the canonical
      reference. Designers may draw rectangles in Figma but the
      component instance is named "Button" and developers always
      render it as `<button>`.

  - figma: Hover / focus / active / disabled modeled as Figma variants on every variant × size combination
    code: CSS pseudo-classes (`:hover`, `:focus-visible`, `:active`) and the HTML `disabled` attribute
    consequence: >-
      Variant explosion: 5 variants × 3 sizes × 4 states × 2 widths
      = 120 component variants. The Figma file becomes unmaintainable
      and developers cannot mechanically map a Figma "hover variant"
      to a CSS rule.
    correct: >-
      States live on a separate states sheet, documented once. Figma
      variants are reserved for variant (primary / secondary / …),
      size, and width (auto / full). State styling is documented as
      CSS rules referencing `:hover`, `:focus-visible`, etc.

  - figma: A "loading button" variant that visually replaces the label with a spinner
    code: A `loading` data state that disables the button, swaps the leading icon for a spinner, and announces busy via `aria-busy="true"`
    consequence: >-
      Designers may not realise the button must remain announced as
      busy; developers may strip the disabled attribute to keep the
      button focusable, missing the announcement entirely.
    correct: >-
      Document `loading` as a data state. The button is `aria-busy`,
      not `disabled` (so its label remains announceable), and a
      spinner replaces the leading icon. The button is non-activatable
      while loading via a click-handler guard, not via the disabled
      attribute.

  - figma: A "link button" variant that looks like a button but navigates
    code: A `<button>` cannot navigate; navigation requires `<a>`. The "link button" must render as an anchor with button styling.
    consequence: >-
      Developers ship a `<button>` with a click handler that calls
      `router.push`. The element loses middle-click "open in new tab",
      cannot be copied as a URL, and breaks user expectations for
      links.
    correct: >-
      Distinguish at the canonical level: a `Button` triggers an
      action, a `Link` navigates. A "link styled as a button" remains
      an `<a>` element with button visual treatment. The component
      reference may document a `Link` component that shares the
      button's visual variants.

mistakes:
  - id: button-icon-only-no-label
    severity: blocker
    title: Icon-only button with no `aria-label`
    description: >-
      The visual is a single icon and the button carries no
      accessible name. Screen readers announce "button" with no
      indication of what it does.
    fix: >-
      Every icon-only button has an `aria-label` describing the
      action ("Close", "Sort ascending"). Lint rule: any button
      whose textContent is empty must have `aria-label` or
      `aria-labelledby`.

  - id: button-disabled-tooltip
    severity: major
    title: Disabled button has a tooltip explaining why
    description: >-
      The `disabled` attribute removes the button from the focus
      order, so keyboard users cannot trigger the tooltip and never
      see the explanation.
    fix: >-
      Use `aria-disabled="true"` instead of `disabled` when the
      button needs to remain focusable for tooltip discovery.
      Activation is suppressed via a click-handler guard. The
      tooltip appears on focus and hover.

  - id: button-loading-removes-label
    severity: major
    title: Loading state replaces the label with a spinner only
    description: >-
      The visible label is replaced by a spinner, but the button's
      accessible name remains the original label. Screen-reader
      users hear "Save" while the button is in fact unactivatable.
    fix: >-
      Keep the label visible (or visually hidden but accessible)
      during the loading state. Set `aria-busy="true"`. Announce
      the loading start and completion via a live region rather
      than mutating the button's accessible name.

  - id: button-submit-default-in-toolbar
    severity: major
    title: A button inside a `<form>` defaults to `type="submit"`
    description: >-
      A button placed inside a form without an explicit `type`
      attribute submits the form when clicked. The first button in
      a toolbar accidentally becomes the form's submit on Enter.
    fix: >-
      Always set `type="button"` on buttons that do not submit. Make
      the canonical reference's default `type` value `"button"`,
      and require an explicit `type="submit"` opt-in.

  - id: button-text-in-anchor
    severity: major
    title: A `<button>` wrapped in an `<a>` for navigation
    description: >-
      The DOM has a button inside an anchor (`<a><button>Go</button></a>`),
      producing nested interactive elements. Assistive tech announces
      ambiguously, and click events bubble through both.
    fix: >-
      Use the right element: `<a>` for navigation styled as a
      button, `<button>` for in-page actions. Never nest interactive
      elements.

frameworkMap:
  webComponents:
    structureMechanism: A `<ui-button>` host element that internally renders a `<button>` and exposes named slots for `icon-leading`, default (label), and `icon-trailing`
    variantMechanism: attributes (`variant="primary"`, `size="md"`, `loading`); reflected to host classes for CSS selectors
  react:
    structureMechanism: a single `<Button>` component that accepts `leadingIcon`, `trailingIcon`, and children for the label
    variantMechanism: props with class-variance-authority for variant / size / fullWidth; `data-loading` attribute for the loading state
  angularSignals:
    structureMechanism: a `<ui-button>` component projecting the label via `<ng-content>`; `[uiIconLeading]` / `[uiIconTrailing]` directives or named projection slots
    variantMechanism: input<'primary' | 'secondary' | 'tertiary' | 'ghost' | 'destructive'>(); input<'sm' | 'md' | 'lg'>(); host-bound `[disabled]` and `[attr.aria-busy]`
  vue:
    structureMechanism: a `<Button>` SFC with named slots for leading and trailing icons and a default slot for the label
    variantMechanism: defineProps with literal-union types; `:loading` boolean prop drives `aria-busy`

i18n:
  rtl:
    mirroring: >-
      Leading and trailing icons swap visual position via logical
      `inline-start` / `inline-end` properties — what was on the left in
      LTR appears on the right in RTL. Directional icons (chevrons, arrows
      indicating progression) flip horizontally to preserve their semantic
      direction. Loading-spinner rotation does *not* mirror — circular
      motion is direction-neutral. The focus ring, padding, and
      typography render identically in both directions.
  textExpansion: >-
    Labels can grow 30–50% longer in German, Russian, or Finnish. The
    canonical Button does not enforce a max-width — buttons grow with
    their label. Truncation is a last resort and requires a `title`
    attribute carrying the full label so SR users still hear it.
    Icon-only buttons are immune (the icon does not translate); the
    aria-label is the translation surface.

formIntegration:
  nativeElement: button
  name: >-
    `<button>` with a `name` attribute participates in form submission
    — the button's `[name]=[value]` is appended to the form's FormData
    when this button is the submitter. Buttons without `name` do not
    contribute to FormData. The canonical reference treats `name` as a
    passthrough to the underlying `<button>`.
  submittedValue: >-
    Only the activating submit button's `[name]=[value]` pair is
    appended (not all buttons in the form). Multi-action forms
    distinguish via shared key — `<button name="action" value="save">`
    plus `<button name="action" value="discard">`. Default value is
    empty string when no `value` attribute is set.
  requiredAttr: false
  formData: >-
    On submit, only the activating submit button's `[name]=[value]`
    pair is appended (not all buttons in the form). This makes Button
    useful for multi-action forms — `<button name="action" value="save">`
    and `<button name="action" value="discard">` distinguish via the
    submitted value of the same key.
  reset: >-
    `<button type="reset">` calls `form.reset()` on the parent form,
    restoring controls to their default values and clearing any
    `setCustomValidity()` state. Programmatic `form.reset()` triggers
    the same path. Reset does not submit and does not navigate.
  validation: >-
    `<button type="submit">` triggers HTML5 validation
    (`form.checkValidity()`); the first invalid field receives focus
    and the form's `:invalid` pseudo-class state propagates. The
    `formnovalidate` attribute on the submit button suppresses
    validation for that specific submit path — useful for "save draft"
    patterns where partial input is allowed.
  bridges:
    react: >-
      Pass `name` / `value` / `type` / `formNoValidate` directly to the
      Button — they passthrough to the native `<button>`. React Hook
      Form / Formik recognise the submit button as the FormData
      submitter automatically; no register-call needed for buttons
      themselves (only for fields). Custom Button-shaped controls
      that wrap `<button>` need to forward these attributes
      explicitly.
    vue: >-
      Native `<button>` participates without v-model. Pass `name` /
      `value` / `type` as plain attributes; VeeValidate / FormKit
      observe the submit event on the parent form, not the button.
      Composable wrappers (PrimeVue Button) forward attributes via
      `$attrs` inheritance.
    angularSignals: >-
      `<button>` with `type="submit"` participates in NgForm /
      ReactiveForms automatically; the form's `(ngSubmit)` fires when
      the activating button submits. `name` / `value` passthrough as
      attribute bindings. Dedicated material `mat-button` directives
      preserve form-association via host-binding.
    webComponents: >-
      ElementInternals API for form-association: `static
      formAssociated = true` plus `internals.setFormValue(value)` when
      the activating submit. Falls back to a slotted native
      `<button>` inside the custom element when element-internals is
      not available; the slotted button participates natively.

propertyMap:
  - figma: Variant
    code: variant
    kind: enum
    notes: >-
      Maps the visual variant set (primary / secondary / tertiary / ghost
      / destructive). Figma stores it as a Variant property; code as a
      string union.
  - figma: Size
    code: size
    kind: enum
  - figma: Has Leading Icon
    code: iconLeading
    kind: boolean
    notes: >-
      Toggles slot visibility in Figma. Code does not have a matching
      boolean — the icon-leading slot is conditionally rendered based on
      whether a child is provided.
  - figma: Has Trailing Icon
    code: iconTrailing
    kind: boolean
  - figma: Leading Icon
    code: iconLeading
    kind: slot
    notes: >-
      Swaps the icon component instance when 'Has Leading Icon' is true.
      Code passes the icon as slot child (React `leadingIcon` prop or
      named slot).
  - figma: Label
    code: children
    kind: text
    notes: Maps to the default slot / children — the label text.
  - figma: Loading
    code: loading
    kind: boolean
    notes: >-
      Drives the data state. In Figma it toggles the spinner overlay; in
      code it sets `aria-busy="true"` and replaces the leading icon with
      a spinner.
  - figma: Full Width
    code: fullWidth
    kind: boolean
a11yAcceptance:
  keyboardWalk:
    - keys: Tab
      expected: >-
        Focus enters the button when reachable in tab order. The visible
        focus ring matches `color.border.focus`; non-disabled buttons are
        always reachable, `disabled` buttons are skipped.
    - keys: Enter or Space
      expected: >-
        Activates the button (same handler path as a pointer click). For
        Space, activation fires on key release, not on key down — matches
        the native `<button>` behavior.
  announcements:
    - trigger: Focus enters the button
      expected: >-
        The button's accessible name followed by "button" (e.g. "Save
        changes, button"). Icon-only buttons announce the `aria-label` in
        place of the missing visible label.
    - trigger: '`loading` data state set to true'
      expected: >-
        Screen readers announce the busy state via `aria-busy="true"`.
        The accessible name remains the original label ("Save changes,
        busy, button") rather than being replaced with "loading".
    - trigger: Disabled state set
      expected: >-
        Native `disabled` removes the button from focus order silently.
        `aria-disabled="true"` keeps it focusable; SR announces "<label>,
        dimmed, button" or equivalent (varies by SR vendor).
  axeCoreVersion: '4.10.2'
  axeRules:
    - button-name
    - aria-allowed-role
    - color-contrast
    - focus-order-semantics

