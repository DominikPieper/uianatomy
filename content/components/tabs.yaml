id: tabs
name: Tabs
description: >-
  A switching control that exposes a flat set of mutually exclusive
  panels through a row (or column) of tab triggers. Used to chunk
  related content under a single surface so only one chunk is visible
  at a time.
whenToUse:
  use: >-
    When chunking related content into 3–7 mutually exclusive panels
    under a single surface where the user picks one chunk at a time.
    Best for parallel views of the same subject (a settings page
    with "Account / Notifications / Billing" panels) or alternative
    presentations of the same data.
  avoid: >-
    For sequential steps that must complete in order — that is
    `Stepper` or a wizard pattern. For navigation between top-level
    pages — that is `SidebarNav` or breadcrumbs. For more than seven
    panels — split into a navigation hierarchy or a search
    interface; tab-row overflow is a recovery pattern, not a design
    target.
  vsRelated:
    - id: accordion
      difference: >-
        `Accordion` allows multiple panels open at once (or one at a
        time, but visually stacked); `Tabs` always show one panel
        and replace it on selection. Accordion preserves all panel
        labels on screen; Tabs surface only one panel's content.
    - id: segmented-control
      difference: >-
        `SegmentedControl` switches between mutually exclusive
        *views of the same content* (e.g. "List / Grid" toggle);
        `Tabs` switches between *different content* under the same
        heading. Segmented controls tend to live above the content
        they control; tabs replace it.
    - id: sidebar-nav
      difference: >-
        `SidebarNav` navigates between independent pages with their
        own URLs; `Tabs` swap inline content within one page.
        Vertical Tabs and SidebarNav can look similar — the
        distinguisher is whether selecting changes the URL.

anatomy:
  - id: tablist
    required: true
    purpose: >-
      The container that holds the tab triggers. Establishes the
      tablist semantic, the orientation, and the keyboard model
      (arrow keys cycle through tabs within the list).
    layout:
      row: 1
      col: 1
      span: full
    figma:
      type: frame
      hint: Auto-layout horizontal frame; gap and padding from token set
    code:
      slot: tablist
      semantic: tablist
    a11y:
      hint: >-
        `role="tablist"` with `aria-orientation` matching the visual
        orientation. If the tabs label a region elsewhere on the page,
        give the tablist an `aria-label` or `aria-labelledby`.
    tokens:
      spacing:
        padding: spacing.tight
        gap: spacing.tight
      radius:
        corner: radius.md
      color:
        border: color.border.subtle

  - id: tab
    required: true
    purpose: >-
      Individual trigger that activates its associated tabpanel. One
      anatomy slot describes the *role*; in practice one component
      instance is rendered per tab.
    layout:
      parent: tablist
      row: 1
      span: 4
      repeats: 3
    figma:
      type: instance
      hint: Tab item component instance; selected state via component property
    code:
      slot: tab
      semantic: tab
    a11y:
      hint: >-
        `role="tab"`. Exactly one tab in the list has `aria-selected="true"`
        at any time. `aria-controls` references the associated tabpanel
        id. Disabled tabs use `aria-disabled` and remain focusable so
        keyboard users can still navigate to them.
    tokens:
      spacing:
        padding: spacing.compact
      radius:
        corner: radius.sm
      typography:
        size: text.sm
        weight: weight.medium
      color:
        foreground: color.text.muted
        ring: color.border.focus

  - id: indicator
    required: false
    purpose: >-
      Optional decorative element that emphasises the selected tab
      (typically an underline). Not part of the semantic structure;
      driven from the selected tab's geometry.
    layout:
      floating:
        anchor: tab
        position: below
        offset: 4
      span: 4
      aspect: '32:1'
    figma:
      type: rectangle
      hint: 2-3px line component variant; position bound to selected tab
    code:
      slot: indicator
      semantic: presentational
    a11y:
      hint: >-
        Presentational only. Selection is communicated through
        `aria-selected` on the tab; the indicator is a visual
        reinforcement, not a substitute.
    tokens:
      radius:
        corner: radius.pill
      color:
        background: color.accent.bg

  - id: tabpanel
    required: true
    purpose: >-
      The content region revealed by selecting a tab. One per tab in
      practice; one anatomy slot describes the role.
    layout:
      row: 2
      col: 1
      span: full
    figma:
      type: frame
      hint: Auto-layout vertical frame; visibility driven by selected variant
    code:
      slot: tabpanel
      semantic: tabpanel
    a11y:
      hint: >-
        `role="tabpanel"` with `aria-labelledby` pointing at its tab.
        Make the panel programmatically focusable (`tabindex="0"`) only
        if the panel itself is the first interactive surface; otherwise
        let the first interactive child receive focus naturally.
    tokens:
      spacing:
        padding: spacing.comfortable
      typography:
        size: text.md
        lineHeight: leading.normal
      color:
        foreground: color.text.primary

axes:
  variants:
    - line
    - contained
    - pill
  properties:
    - name: orientation
      kind: enum
      values: [horizontal, vertical]
    - name: activation
      kind: enum
      values: [automatic, manual]
    - name: density
      kind: enum
      values: [comfortable, compact]
  states:
    interactive:
      - hover
      - focus-visible
      - active
      - disabled
    data:
      - selected
      - busy
      - lazy
      - error

mismatches:
  - figma: Each tab state (default / hover / selected / disabled) modeled as a separate Figma variant on the tab component
    code: A single tab element with `:hover`, `:focus-visible`, and `aria-selected` driving CSS
    consequence: >-
      Variant explosion: 4 states × 3 sizes × 2 orientations = 24
      variants, and developers cannot mechanically map a Figma
      "hover variant" to a CSS pseudo-class without manual translation.
    correct: >-
      States belong on a separate states sheet, not as variants. The
      Figma component captures structural variants (line / contained /
      pill); the canonical reference documents the state matrix once.

  - figma: The active-tab underline drawn as a separate decorative line component on the artboard
    code: An indicator pseudo-element (or absolute-positioned div) whose position is bound to the selected tab
    consequence: >-
      Designers move the underline manually when switching the visible
      tab in mocks; developers wire the indicator to selection
      programmatically. The two artefacts disagree about which tab is
      active at any given mock.
    correct: >-
      Document that the indicator is presentational and *derived from*
      the selected tab. In Figma, bind the indicator's position to the
      selected variant; in code, animate the indicator from the
      selected tab's bounding box.

  - figma: Vertical tabs drawn as a left sidebar with no semantic relationship to the right-hand content
    code: Vertical tabs use the same `role="tablist"` with `aria-orientation="vertical"` and arrow keys reverse from horizontal to vertical
    consequence: >-
      Designers and developers diverge on whether a vertical layout is
      "tabs" or a "sidebar nav". The keyboard model and the announced
      role differ between the two patterns.
    correct: >-
      Treat vertical tabs as the same component with an `orientation`
      property. Reserve "sidebar nav" as a distinct pattern with
      different keyboard semantics (Tab moves between links, no arrow
      cycling).

  - figma: Manual vs. automatic activation modeled as two visually identical Figma components
    code: A property toggles whether arrow-key navigation activates the tab on focus (automatic) or only on Enter / Space (manual)
    consequence: >-
      Designers may not realise activation mode is a meaningful
      decision. Developers default to one mode without knowing the
      other exists; users with assistive tech feel the difference.
    correct: >-
      Document `activation` as a first-class property in the
      canonical reference. Default is automatic for tabs that swap
      cheap, static content; manual for tabs that load expensive
      content per panel.

  - figma: A tablist that overflows the available width drawn either as wrapped onto a second row or simply truncated at the edge
    code: Overflowing tablists scroll horizontally with edge-fade affordances and Home / End / arrow keys that scroll the focused tab into view
    consequence: >-
      Designers either invent a wrapping pattern that breaks the
      single-row keyboard model, or hide the overflow with no
      affordance, leaving developers to invent the scroll behavior
      ad hoc. Keyboard users on overflowing tablists land on tabs
      that are visually offscreen.
    correct: >-
      Standardise horizontal scroll for overflowing tablists with
      edge-fade affordances and explicit "scroll focused tab into
      view" behaviour on Home / End / arrow navigation. Reserve
      wrapping for explicit multi-row layouts (rare; usually a sign
      the structure should be rethought).

mistakes:
  - id: tabs-no-arrow-keys
    title: Tab key cycles through every tab instead of arrow keys
    description: >-
      Implementation uses native focusable buttons with no roving
      `tabindex`, so Tab walks through every tab plus the panels
      below. Screen-reader users hear "tab 1 of N" announcements
      conflicting with the actual document order.
    fix: >-
      Implement the roving-tabindex pattern: only the selected tab
      has `tabindex="0"`, all other tabs have `tabindex="-1"`. Arrow
      keys (Left/Right for horizontal, Up/Down for vertical) move
      focus between tabs and update the roving tabindex.

  - id: tabs-panel-not-labelled
    title: Tabpanels missing `aria-labelledby` to their tab
    description: >-
      The panel announces only its content with no relationship to
      the tab that controls it. Screen-reader users navigating the
      page out of order cannot identify which tab the panel belongs
      to.
    fix: >-
      Each tabpanel sets `aria-labelledby` to the id of its tab.
      Each tab sets `aria-controls` to the id of its panel.

  - id: tabs-state-as-data-attribute-only
    title: Selection driven only by a `data-selected` attribute, no `aria-selected`
    description: >-
      Visual selection works (CSS targets the data attribute) but
      assistive tech reports every tab as unselected.
    fix: >-
      `aria-selected` is the source of truth. Style from
      `[aria-selected="true"]` rather than introducing a parallel
      `data-selected` attribute that has to stay in sync.

  - id: tabs-disabled-but-not-skipped
    title: Disabled tabs cannot receive keyboard focus
    description: >-
      Setting `disabled` on a disabled tab removes it from the focus
      order entirely, breaking arrow-key navigation between the
      remaining tabs and stranding users on the disabled tab.
    fix: >-
      Use `aria-disabled="true"` instead of the HTML `disabled`
      attribute. The disabled tab remains focusable and announceable;
      activation (Enter / Space) is the operation that becomes a
      no-op.

  - id: tabs-lazy-panel-no-aria-busy
    title: Lazy-loaded tabpanel renders empty without an `aria-busy` announcement
    description: >-
      Selecting a tab fetches its panel content asynchronously. The
      panel is mounted immediately but empty, so screen-reader users
      land on a tabpanel with no perceivable content and no signal
      that anything is loading.
    fix: >-
      Set `aria-busy="true"` on the tabpanel while content is in
      flight, render a visible loading affordance, and announce the
      transition (e.g. via `aria-live="polite"` on a status region
      inside the panel). Clear `aria-busy` when content is ready.

  - id: tabs-overflow-no-scroll-into-view
    title: Overflowing tablist does not scroll the focused tab into view
    description: >-
      The tablist scrolls horizontally on overflow, but pressing
      arrow keys, Home, or End moves focus to a tab that remains
      offscreen. Sighted keyboard users lose track of focus; screen
      magnifier users see no movement.
    fix: >-
      On focus change inside the tablist (arrow keys, Home, End),
      call `element.scrollIntoView({ block: 'nearest', inline:
      'nearest' })` on the newly focused tab, or compute the scroll
      offset manually so the focused tab is fully visible with a
      small inline padding.

  - id: tabs-indicator-not-rtl-aware
    title: Indicator animation hard-codes left-to-right movement
    description: >-
      The selected-tab indicator animates by interpolating `left` /
      `transform: translateX(...)` from the previous tab to the
      next. Under `dir="rtl"` the indicator slides the wrong way or
      ends up offset from the active tab.
    fix: >-
      Compute the indicator position from the selected tab's
      bounding box (`getBoundingClientRect`) relative to the
      tablist, not from a directional offset. Use logical
      properties (`inset-inline-start`) or transform values that
      respect writing direction.

frameworkMap:
  webComponents:
    structureMechanism: A `<ui-tabs>` host element with named slots for `tablist` and content panels exposed through `<slot name="panel-{id}">`
    variantMechanism: attributes for variant / orientation / activation; `[selected]` attribute on tab elements drives styling
  react:
    structureMechanism: compound components (`Tabs.Root`, `Tabs.List`, `Tabs.Trigger`, `Tabs.Content`) à la Radix; or the React Aria `useTabList` hook with a collection
    variantMechanism: props on `Tabs.Root` (variant / orientation / activationMode); selection state as a controlled or uncontrolled value prop
  angularSignals:
    structureMechanism: Angular CDK A11y `cdk-tab-group` or a custom directive composition with content projection; signal-based selectedIndex
    variantMechanism: input<'line' | 'contained' | 'pill'>(), input<'horizontal' | 'vertical'>(), input<'automatic' | 'manual'>()
  vue:
    structureMechanism: Headless UI `<TabGroup>` / `<TabList>` / `<Tab>` / `<TabPanels>` / `<TabPanel>`
    variantMechanism: defineProps with literal-union types; `:selected-index` for controlled selection

motion:
  reducedMotionFallback: instant
  durations:
    indicator: motion.duration.fast
  easing: motion.easing.standard

responsive:
  breakpoints:
    - at: breakpoint.sm
      change: >-
        At and below, the `vertical` orientation is forced to horizontal
        with overflow-scroll on the tablist — vertical tab columns claim
        too much inline space on narrow viewports. Indicator continues to
        track the selected tab; arrow keys revert to Left/Right.
    - at: breakpoint.lg
      change: >-
        Above this width, the `orientation` property is honoured as
        authored. Vertical layouts dock the tablist on the inline-start
        edge with a fixed inline-size; arrow keys map Up/Down to next/prev
        tab. The indicator switches from a bottom underline to an
        inline-start side bar.

events:
  - name: selectedChange
    payload: >-
      The id of the newly selected tab — always a string matching one of
      the rendered tab ids; never empty. In `activation: automatic` mode
      fires on every focus change inside the tablist; in
      `activation: manual` mode fires only when the user activates a
      focused tab via Enter or Space.
    frameworkNotes:
      webComponents: >-
        `change` CustomEvent on the `<ui-tabs>` host with
        `event.detail = { selectedId }`. Listen on the host, not on
        individual tab elements.
      react: >-
        `onValueChange(value: string)` (Radix `Tabs.Root`) or
        `onSelectionChange(key: Key)` (React Aria `useTabList`). Both
        fire on the same edge.
      angularSignals: >-
        `output<string>('selectedChange')`; pair with `[(selected)]`
        for two-way binding when the parent owns selection.
      vue: >-
        `@update:modelValue` for `v-model` on the selected id. Headless
        UI `<TabGroup>` provides `@change(index: number)` for consumers
        that prefer index-based selection.

  - name: tabActivate
    payload: >-
      The id of the tab whose panel was requested. Distinct from
      `selectedChange` only in `activation: manual` mode — the user has
      moved focus across tabs and pressed Enter or Space to commit. In
      `automatic` mode this event is a no-op alias of `selectedChange`.
    frameworkNotes:
      webComponents: >-
        Same `change` mechanism, but only emitted on activation. The
        highlight state is internal and not exposed.
      react: >-
        Radix `Tabs` does not expose an activate-only event; React Aria
        `useTabList` exposes `onAction(key)` for the activate-only path
        so consumers can distinguish navigation from activation.
      angularSignals: >-
        `output<string>('tabActivate')`; only emits in manual
        activation mode.
      vue: >-
        `@activate` event in manual mode; `automatic` mode collapses it
        into `@update:modelValue`.

a11yAcceptance:
  keyboardWalk:
    - keys: Tab
      expected: >-
        Focus enters the tablist on the currently selected tab (roving
        tabindex — only the selected tab has `tabindex="0"`). One more
        Tab leaves the tablist toward the tabpanel or its first
        focusable descendant; further Tabs walk into and through the
        panel content.
    - keys: ArrowLeft / ArrowRight (horizontal) or ArrowUp / ArrowDown (vertical)
      expected: >-
        Moves focus to the previous/next tab inside the tablist. In
        `activation: automatic` mode the tab activates on focus
        (`aria-selected="true"`, panel swaps); in `activation: manual`
        mode focus moves but selection is unchanged.
    - keys: Home / End
      expected: >-
        Focus moves to the first/last tab in the tablist. Activation
        follows the active activation mode.
    - keys: Enter or Space (in manual mode)
      expected: >-
        Activates the focused tab — `aria-selected` flips, the panel
        renders. In automatic mode this is a no-op (already activated by
        focus).
  announcements:
    - trigger: Focus enters a tab
      expected: >-
        SR announces "<label>, tab, selected" for the currently selected
        tab, or "<label>, tab" for non-selected tabs, followed by
        position ("1 of 3"). Position comes from the `aria-posinset` /
        `aria-setsize` pair when the tablist is large or generated.
    - trigger: Lazy panel mounts with `aria-busy="true"`
      expected: >-
        SR announces the busy state on the tabpanel; once
        `aria-busy="false"` and content lands, SR reads the panel content
        starting with the next focusable inside.
    - trigger: Selection changes via arrow keys (automatic mode)
      expected: >-
        Old panel is removed from the AT tree (or marked
        `aria-hidden="true"` if kept in DOM); new panel is announced via
        its `aria-labelledby` relationship to the newly selected tab.
  axeRules:
    - aria-required-children
    - aria-required-parent
    - aria-roles
    - tabindex
    - color-contrast
    - focus-order-semantics

sources:
  - https://www.w3.org/WAI/ARIA/apg/patterns/tabs/
  - https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Roles/tab_role
  - https://www.radix-ui.com/primitives/docs/components/tabs
  - https://react-spectrum.adobe.com/react-aria/Tabs.html
  - https://headlessui.com/react/tabs
  - https://polaris.shopify.com/components/navigation/tabs
  - https://carbondesignsystem.com/components/tabs/usage/
  - https://m3.material.io/components/tabs/overview
  - https://atlassian.design/components/tabs/examples
  - https://inclusive-components.design/tabbed-interfaces/

