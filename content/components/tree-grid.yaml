notes: >-
  Steepest authoring overhead in the canon — inherits the
  full Grid keyboard model and adds ArrowRight / ArrowLeft
  tree-navigation. Reach for it only when hierarchical-
  tabular affordance justifies the cost; the
  treegrid-when-tree-suffices mistake documents the
  down-escalation. The aria-level-drives-visual-indent
  contract is the highest-load-bearing implementation
  detail.

