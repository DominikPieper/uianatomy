id: modal
name: Modal
description: >-
  A transient overlay surface that suspends the underlying view and demands
  attention or input before the user can return to the rest of the page.
  Synonymous with "dialog" in the ARIA Authoring Practices Guide; "modal"
  emphasises the *modality* (the page is blocked) over the dialog box
  itself.
intro: >-
  Modal interrupts the main flow with a focus-trapped surface
  that demands user resolution before the page becomes operable
  again. It is the strongest interruption surface in the canon —
  distinguished from Drawer (may be modal or non-modal), Popover
  (always non-modal), and Banner (never modal) by the focus trap
  and the inert background. The dialog and alertdialog variants
  split by SR-announcement priority. The reference documents the
  stacking contract (max one open dialog), the focus-trap and
  focus-restore obligations, the inert-not-aria-hidden rule, and
  the Escape-dismiss pattern.

alternateNames:
  - 'Dialog'
  - 'Alert dialog'

whenToUse:
  use: >-
    When the user must focus on a single decision or input that
    blocks the underlying flow — confirmations, destructive actions,
    multi-step wizards that must run to completion. Distinguished
    from non-blocking surfaces by the focus trap and the `inert`
    background.
  avoid: >-
    For non-blocking notifications — that is `Toast` or `Banner`.
    For contextual content tied to a trigger — that is `Popover`.
    For side-pane content that does not require completion before
    returning to the page — that is `Drawer`. For inline disclosure
    of secondary detail — that is `Disclosure` or `Accordion`.
    Stacking modals is non-canonical: the maximum is one open dialog
    at a time. Stacked modals fight for focus traps, leak `inert`
    handling between layers, and confuse assistive tech that walks the
    modality tree. Patterns that feel like they need "modal-on-modal"
    should be redesigned as a step flow within a single modal, or as a
    sequence of modal → dismiss → modal.
  vsRelated:
    - id: drawer
      difference: >-
        `Drawer` slides from a viewport edge and may be modal or
        non-modal; `Modal` always centres and is always modal.
        Drawer is preferred for navigation, filters, and side panels
        that accompany the main flow rather than blocking it.
    - id: popover
      difference: >-
        `Popover` is non-modal, anchored to a trigger, and
        dismissable by outside-click without ceremony. `Modal` is
        modal, viewport-centred, and dismissal requires explicit
        user intent (Escape, close button, or commit).
    - id: alert
      difference: >-
        `Alert` is a non-blocking inline message that announces to
        assistive tech via `aria-live`.
        `Modal` with `variant: alertdialog` is a blocking variant
        for confirmations that demand user response; do not confuse
        the two.
    - id: banner
      difference: >-
        `Banner` is a page-level non-blocking announcement strip
        anchored to the layout (top or bottom). `Modal` interrupts
        the flow and demands a decision; banners persist alongside
        the content and never trap focus.
    - id: disclosure
      difference: >-
        `Disclosure` reveals secondary detail inline and never
        blocks the page. `Modal` blocks the page and demands an
        explicit dismiss; reach for it only when the user must
        complete the task before returning to the rest of the flow.
    - id: toast
      difference: >-
        `Toast` is a transient, dismissable notification that
        floats above content without focus or modality. `Modal`
        steals focus, traps it, and waits for the user to commit
        or dismiss. Toasts inform; modals interrupt.
    - id: tooltip
      difference: >-
        `Tooltip` is hover- or focus-revealed descriptive text on
        a single trigger; carries no actions and dismisses on
        blur. `Modal` is a focus-trapping decision surface.
        Tooltips supplement; modals block.

anatomy:
  - id: backdrop
    required: true
    purpose: >-
      Full-viewport scrim behind the dialog that visually de-emphasises
      the underlying content and intercepts pointer events. Distinct
      from the dialog container so it can be styled and animated
      independently.
    slotKind: decorative
    layout:
      overlay: true
    figma:
      type: frame
      hint: Full-bleed frame with semi-transparent fill below the container
    code:
      slot: backdrop
      semantic: presentational-overlay
    a11y:
      hint: >-
        Backdrop is presentational; do not put role on it. Clicking the
        backdrop may dismiss the dialog when `dismissible` is true, but
        keyboard users must always have an explicit close affordance.
    tokens:
      color:
        background: color.surface.scrim

  - id: container
    required: true
    purpose: >-
      The dialog box itself — the bounded surface that renders header,
      body, and footer. Carries the focus trap and the dialog role.
    slotKind: structural
    layout:
      row: 1
      col: 1
      span: full
    figma:
      type: frame
      hint: Centered auto-layout frame; size variant drives width
    code:
      slot: container
      semantic: dialog-or-alertdialog
    a11y:
      hint: >-
        Apply `role="dialog"` (or `role="alertdialog"` for the alert
        variant) and `aria-modal="true"`. Label via `aria-labelledby`
        pointing at the title slot, and optionally `aria-describedby`
        pointing at the body. Focus is trapped here while open and
        restored to the trigger on close.
    tokens:
      spacing:
        padding: spacing.comfortable
      radius:
        corner: radius.lg
      color:
        background: color.surface.raised
        border: color.border.subtle
      elevation:
        shadow: elevation.overlay

  - id: header
    required: false
    purpose: >-
      Top region grouping title and close affordance. Optional because
      some dialogs (alert dialogs, confirmation dialogs) inline the
      title with the body and place the close affordance in the footer.
    slotKind: structural
    layout:
      parent: container
      row: 1
      span: full
    figma:
      type: frame
      hint: Auto-layout horizontal frame; padding from container token
    code:
      slot: header
      semantic: heading-region
    a11y:
      hint: >-
        Header is a layout region, not a heading. The actual heading
        semantics live on the title element.
    tokens:
      spacing:
        padding: spacing.compact
        gap: spacing.compact

  - id: title
    required: true
    purpose: >-
      The dialog's name. The first thing announced after the dialog
      opens and the value of `aria-labelledby` on the container.
    slotKind: content
    layout:
      parent: header
      row: 1
      col: 1
      span: 9
    figma:
      type: text
      hint: Heading text style; bound to a component property for content
    code:
      slot: title
      semantic: heading
    a11y:
      hint: >-
        Use a real heading element of an appropriate level. Reference
        it from the container with `aria-labelledby`. Never rely on
        `aria-label` on the container if a visible title exists.
    tokens:
      typography:
        size: text.lg
        weight: weight.semibold
        lineHeight: leading.tight
      color:
        foreground: color.text.primary

  - id: close-button
    required: false
    purpose: >-
      Visible affordance for dismissing the dialog without committing
      its primary action. Conventionally an "×" icon in the trailing
      edge of the header, but may live in the footer for alert dialogs.
    slotKind: interactive
    layout:
      parent: header
      row: 1
      col: 2
      span: 3
    figma:
      type: instance
      hint: Icon button instance; bound to component slot for variant swap
    code:
      slot: close
      semantic: button
    a11y:
      hint: >-
        Provide an accessible name ("Close" or "Close dialog"); a bare
        × glyph is not announced. The Escape key must do the same thing
        as clicking this button when the dialog is dismissible.
    tokens:
      spacing:
        padding: spacing.tight
      radius:
        corner: radius.sm
      color:
        foreground: color.text.muted
        ring: color.border.focus

  - id: body
    required: true
    purpose: >-
      Primary payload — the content the dialog exists to surface or
      collect. Keep scrolling self-contained within the body if the
      content overflows; the header and footer should remain pinned.
    slotKind: content
    layout:
      parent: container
      row: 2
      span: full
    figma:
      type: frame
      hint: Auto-layout vertical frame; min-height drives "comfortable" density
    code:
      slot: body
      semantic: prose-or-form
    a11y:
      hint: >-
        Body retains its native semantics (forms stay forms). If the
        body is the dialog's description, reference its container with
        `aria-describedby` on the container.
    tokens:
      spacing:
        padding: spacing.comfortable
      typography:
        size: text.md
        lineHeight: leading.normal
      color:
        foreground: color.text.primary

  - id: footer
    required: false
    purpose: >-
      Bottom region grouping the dialog's commit/cancel actions. Order
      and emphasis (primary on leading vs. trailing edge) is a
      platform-convention decision documented in the variants table.
    slotKind: structural
    layout:
      parent: container
      row: 3
      span: full
    figma:
      type: frame
      hint: Auto-layout horizontal frame; right-aligned buttons by default
    code:
      slot: footer
      semantic: button-group
    a11y:
      hint: >-
        Container for commit/cancel actions. The button instances live
        inside the action-group sub-anatomy (primary-action /
        secondary-action). Document the default focus target (usually
        the primary action, but the *cancel* action for destructive
        alerts) so behavior is consistent across uses.
    tokens:
      spacing:
        padding: spacing.compact
        gap: spacing.compact

  # P6-126 / ADR-030 — buttons inside the footer use the canonical
  # action-group sub-anatomy. Modal keeps the wrapping `footer` slot for
  # container-level concerns (padding, right-aligned default, focus-on-
  # destructive a11y). The override on primary-action documents the
  # alertdialog-destructive default-focus rule per APG.
  - $ref: action-group
    parent: footer
    overrides:
      - slot: primary-action
        type: overridden
        rationale: >-
          Destructive Modals (alertdialog with destructive intent)
          override default focus to secondary-action per APG.
        a11y:
          hint: >-
            Real button with accessible name. First in DOM order; visual
            position is inline-end via logical properties. For
            alertdialog with destructive intent, consumer overrides
            default focus to secondary-action.

axes:
  variants:
    - name: dialog
    - name: alertdialog
      alternativeNames: [confirm, destructive]
    - name: fullscreen
  properties:
    - name: size
      kind: enum
      values: [sm, md, lg, xl]
    - { name: dismissible, kind: primitive, of: boolean }
    - name: scrollBehavior
      kind: enum
      values: [inside, outside]
  states:
    interactive:
      - focus-visible
    data:
      - opening
      - open
      - closing
      - closed
    transitions:
      - from: closed
        to: opening
        trigger: >-
          User activates the trigger that owns the dialog (button click,
          link activation, programmatic `showModal()`); the previously-
          focused element is captured for restoration on close.
      - from: opening
        to: open
        trigger: >-
          The enter animation completes (or, under `prefers-reduced-motion:
          reduce`, immediately after `closed → opening`). Focus moves into
          the dialog, the focus trap engages, and the rest of the document
          becomes `inert`.
      - from: open
        to: closing
        trigger: >-
          User dismisses via the close button, Escape, or — when
          `dismissible` is true — backdrop click; or the primary action
          commits and programmatically requests close.
      - from: closing
        to: closed
        trigger: >-
          The exit animation completes (or immediately under reduced
          motion). The dialog is removed from the AT tree, `inert` is
          released, and focus is restored to the captured trigger.

mismatches:
  - figma: A "modal" component drawn as a centered rectangle with a separate "backdrop" rectangle stacked on the same page
    code: A portal that lifts the dialog out of the DOM tree, with focus trapping, escape key handling, and `inert` on the rest of the document
    consequence: >-
      The Figma artifact captures the visual treatment but encodes none
      of the modality. Developers approximating from the Figma file may
      ship a div that *looks* like a modal but allows tabbing into the
      page beneath, breaks screen-reader virtual cursors, and routes
      Escape to the wrong handler.
    correct: >-
      Treat the visual layout and the modal *behavior* as separate
      concerns. The Figma component documents anatomy and visual
      treatment; the canonical reference and a11y notes document the
      portal, focus trap, escape, and inert behavior. Designers and
      developers explicitly review both artefacts together.

  - figma: Close icon drawn as a static glyph in the header
    code: An accessible <button> with an ARIA label and matching escape-key handler
    consequence: >-
      The icon is announced as nothing or as the literal "×" character.
      Mouse users can dismiss; keyboard and screen-reader users may not.
    correct: >-
      Treat the close affordance as an explicit slot that must be
      implemented as a real button with an accessible name. Document
      that the Escape key triggers the same handler when `dismissible`
      is true.

  - figma: Multiple stacked dialogs modeled as separate top-level Figma frames with no relationship between them
    code: Stacked dialogs require z-index + correct `inert` toggling so only the topmost dialog is interactive
    consequence: >-
      Visually the second dialog appears on top, but assistive tech may
      still read content from the first. Worse, focus trap collisions
      can leak focus back into the underlying dialog.
    correct: >-
      Document that stacking is a separate behavioral concern, not just
      a layering concern. The canonical guidance is "avoid stacking
      modals; if you must, the topmost owns focus and inert all
      ancestors." Figma may render two stacked frames for illustration
      but the dev guidance is non-trivial.

  - figma: Open/closed and transition states modeled as Figma variants
    code: Data states (`opening`, `open`, `closing`, `closed`) driven by the application and CSS transitions
    consequence: >-
      Variant explosion (size × variant × state). Designers may also
      forget transition states entirely and developers ship without
      enter/exit animations.
    correct: >-
      Model transition states once as data states in the canonical
      reference, with a single visual specification. Reserve Figma
      variants for the structurally different versions
      (`dialog` / `alertdialog` / `fullscreen`).

mistakes:
  - id: modal-no-focus-trap
    severity: blocker
    title: Tab key escapes the dialog into the page beneath
    description: >-
      Without an explicit focus trap, pressing Tab from the last
      interactive element inside the dialog moves focus to the next
      element in the document — usually something visually obscured
      by the backdrop.
    fix: >-
      Implement a focus trap that cycles Tab/Shift+Tab between the
      first and last focusable elements inside the dialog. Most
      modern primitives (Radix Dialog, React Aria, HTMLDialogElement
      `showModal()`) include this for free; never roll your own
      without `inert` on the rest of the document.

  - id: modal-no-focus-restore
    severity: blocker
    title: Focus is lost after the dialog closes
    description: >-
      After dismissal, focus lands on `<body>` instead of the trigger
      that opened the dialog. Keyboard and screen-reader users have
      to re-orient from the top of the page.
    fix: >-
      Capture the previously-focused element on open and restore
      focus to it on close. If the trigger no longer exists (e.g.,
      it was destroyed by the action just confirmed), focus a stable
      landmark such as the page heading or a confirmation toast.

  - id: modal-aria-hidden-leak
    severity: blocker
    title: Setting `aria-hidden` on the body without scoping out the dialog
    description: >-
      Applying `aria-hidden="true"` to `<body>` to keep the
      background out of the AT tree also hides the dialog itself,
      because the dialog is typically a descendant of body in the
      DOM.
    fix: >-
      Either portal the dialog out of body (so the hidden subtree
      excludes it), or use `inert` (which does not collapse the
      subtree from the AT tree but disables interaction). Modern
      stacks should prefer `inert` on siblings of the portal.

  - id: modal-escape-not-bound
    severity: blocker
    title: Escape key does not dismiss a dismissible dialog
    description: >-
      `dismissible` is true (the close button works, the backdrop
      click works) but Escape does nothing — usually because the
      handler was attached to the backdrop element instead of
      document-level.
    fix: >-
      Bind Escape on the dialog container with `keydown` capture, or
      delegate at document level when the dialog is open. Make the
      handler the same one bound to the close button so behavior is
      identical across input modalities.

  - id: modal-backdrop-pointer-leak
    severity: major
    title: Pointer events pass through the backdrop to the page beneath
    description: >-
      The backdrop is rendered with `pointer-events: none` (or no
      backdrop at all), so a click at backdrop coordinates triggers
      the underlying button. The page is no longer modal.
    fix: >-
      The backdrop must intercept all pointer events. Native
      `<dialog>` with `showModal()` does this automatically; custom
      implementations need an opaque or transparent-but-pointer-active
      element covering the viewport behind the container.

frameworkMap:
  webComponents:
    structureMechanism: native HTMLDialogElement (`<dialog>`) with `showModal()`, plus named slots for header / body / footer
    variantMechanism: attributes for variant (`role="alertdialog"`) and size (`size="lg"`); CSS state via `[open]`
  react:
    structureMechanism: portal-based primitives (Radix `Dialog.Root` / `Dialog.Portal` / `Dialog.Content`, or React Aria `Modal` + `Dialog`) compositing the slots as children
    variantMechanism: props with class-variance-authority for size/variant; `data-state` attribute for transition states
  angularSignals:
    structureMechanism: Angular CDK Dialog (`MatDialog` or `Dialog` from `@angular/cdk/dialog`) with content projection or template-based dialogs
    variantMechanism: input<'dialog' | 'alertdialog' | 'fullscreen'>() and input<'sm' | 'md' | 'lg' | 'xl'>(); host bindings drive `[attr.role]`
  vue:
    structureMechanism: Headless UI `<Dialog>` / `<DialogPanel>` or native `<dialog>` with named slots
    variantMechanism: defineProps with literal-union types; `:data-state` for transition states

motion:
  reducedMotionFallback: instant
  durations:
    open: motion.duration.base
    close: motion.duration.fast
    backdrop: motion.duration.fast
  easing: motion.easing.standard

responsive:
  breakpoints:
    - at: breakpoint.sm
      change: >-
        At and below, the `dialog` and `alertdialog` variants render as the
        `fullscreen` variant by default — container fills the viewport,
        backdrop is suppressed (the dialog is the page), header pins to
        the top inset, footer pins to the bottom inset above the safe-area.
        Size property (`sm | md | lg | xl`) is ignored.
    - at: breakpoint.md
      change: >-
        Above this width, all three variants render as authored; the
        explicit `fullscreen` variant continues to fill the viewport but
        non-fullscreen variants honour their `size` property and centre
        with backdrop padding.

events:
  - name: openChange
    payload: >-
      Boolean. `true` when the dialog has finished entering
      (`opening → open`), `false` when it has finished exiting
      (`closing → closed`). Fires after the transition settles, not at
      the start of the transition, so consumers cannot use it to drive
      enter/exit animations — those are owned by the `motion` block.
    frameworkNotes:
      webComponents: >-
        Native `<dialog>` fires `close` on dismissal; an `open` is
        synthesised from `showModal()`. Composite hosts re-emit a unified
        `openChange` CustomEvent with `event.detail = { open: boolean }`.
      react: >-
        `onOpenChange(open: boolean)` controlled-pattern callback
        (Radix `Dialog.Root`). React Aria splits into `onOpen` /
        `onClose` paired callbacks fired at the same moment.
      angularSignals: >-
        `output<boolean>('openChange')`; emits after each transition
        settles. Pair with `[(open)]` two-way binding when consumers
        want a single signal.
      vue: >-
        `@update:open` for `v-model:open` two-way binding. Headless UI
        `<Dialog>` exposes a paired `@close` event for the dismissal
        path.

  - name: dismiss
    payload: >-
      `{ reason: 'escape' | 'backdrop' | 'closeButton' }`. Distinguishes
      a user-initiated dismissal from a programmatic close after a
      primary-action commit. Consumers that need to differentiate
      "user cancelled" from "we committed and closed" listen here, not
      on `openChange`.
    frameworkNotes:
      webComponents: >-
        Native `<dialog>` `cancel` event covers Escape only; a custom
        `dismiss` CustomEvent with the same `event.detail` shape covers
        the backdrop and close-button paths.
      react: >-
        Radix `onOpenChange(false)` carries no reason; React Aria
        `onDismiss(event)` provides the source DOM event so consumers
        can infer the path.
      angularSignals: >-
        `output<DismissReason>('dismiss')` paralleling `openChange`;
        suppressed on programmatic close.
      vue: >-
        `@dismiss` event with payload `{ reason }`. Headless UI raises
        `@close` for both paths; use a wrapper to carry the reason
        explicitly.

i18n:
  rtl:
    mirroring: >-
      Container alignment stays centered (modal centering is
      direction-neutral). Close button moves from inline-end of the
      header (visual right in LTR, visual left in RTL) — implemented via
      `inset-inline-end` on the close-button slot, not hard-coded
      `right`. Footer button order reverses logically: the primary
      commit action stays on inline-end (visual right in LTR, visual
      left in RTL); cancel on inline-start. Backdrop scrim is
      direction-neutral. Title and body inherit document direction; a
      mixed-direction document (e.g. Hebrew title with English body)
      still renders correctly because each text node carries its own
      `dir` attribute.
  textExpansion: >-
    Title can grow into a second line; body has natural overflow with
    inside-scroll behaviour. Footer buttons may wrap to a second row on
    narrow viewports under heavy expansion (German "Veröffentlichen"
    next to "Abbrechen" forces wrap on `breakpoint.sm`). Size variant
    `xl` accommodates the longest expansions; alert-dialog title should
    favour shorter phrasing to avoid wrap on small viewports.

formIntegration:
  nativeElement: none
  name: >-
    Modal is a container, not a form control — it has no `name`
    attribute. Forms hosted inside the dialog carry their own `name`
    attributes on their fields. Native `<dialog>` cooperates with
    `<form method="dialog">` to submit-and-close in a single user
    action.
  submittedValue: >-
    Modal contributes nothing to FormData directly. The
    `<form method="dialog">` pattern is special: the form's submitter
    button populates `dialog.returnValue` (a string read via
    `dialogElement.returnValue` after close) instead of issuing a
    network request. Forms inside the dialog submit normally via
    their own `<form>` element.
  requiredAttr: false
  formData: >-
    Forms inside the dialog submit normally via their own `<form>`.
    The dialog itself contributes nothing to FormData. The
    `<form method="dialog">` pattern is special: the form's submitter
    button populates `dialog.returnValue` instead of issuing a network
    request — useful for in-page commit semantics where the dialog
    closes itself on submit.
  reset: >-
    Forms inside the dialog respond to `form.reset()` independently
    of the dialog's open/closed state. Closing the dialog via Escape
    or backdrop click does not reset the form; consumers that want
    "discard on cancel" semantics call `form.reset()` explicitly in
    the close handler before unmounting the form.
  validation: >-
    Forms inside the dialog use HTML5 validation as normal.
    Validation failures focus the first invalid field — focus stays
    inside the dialog because of the focus trap, so the user lands on
    the field naturally without escaping the modal context.
  bridges:
    react: >-
      React Hook Form / Formik observe the form inside the modal,
      not the modal itself. Pass `onSubmit` to the inner `<form>`;
      the modal close-handler reads form-state via the form-library
      hooks. Radix Dialog and React Aria Modal both leave form
      lifecycle to the consumer. For `<form method="dialog">`
      semantics, render native `<dialog>` plus `<form
      method="dialog">` and read `dialogElement.returnValue` after
      close.
    vue: >-
      VeeValidate / FormKit bind to the inner `<form>` via
      composable. The modal itself is not a form participant. v-model
      on the inner fields drives the form-library's value tree
      independent of the modal's open-state.
    angularSignals: >-
      `formGroup` / `formArray` lives on the inner `<form>` element;
      ngSubmit on that form fires independently of the dialog state.
      Closing the dialog via Esc does not reset the form unless
      consumer explicitly calls `formGroup.reset()` in the close
      handler.
    webComponents: >-
      Modal host is not formAssociated (it is a container, not a
      control). Slotted `<form>` participates natively. For
      `method="dialog"`-style returnValue semantics, the dialog host
      reads its inner form's submitter and propagates the result via
      a `closeWithValue` CustomEvent.

propertyMap:
  - figma: Variant
    code: variant
    kind: enum
    notes: Maps dialog / alertdialog / fullscreen.
  - figma: Size
    code: size
    kind: enum
    notes: sm / md / lg / xl. Ignored in fullscreen variant.
  - figma: Title
    code: title
    kind: text
  - figma: Has Description
    code: description
    kind: boolean
    notes: Slot-visibility toggle; controls whether the body's first paragraph wires `aria-describedby`.
  - figma: Description
    code: description
    kind: text
  - figma: Body
    code: body
    kind: slot
    notes: >-
      Swaps the body content slot (form, prose, custom layout). Code
      receives this as children of the dialog content.
  - figma: Has Footer
    code: footer
    kind: boolean
  - figma: Footer
    code: footer
    kind: slot
    notes: Action group instance — typically Button-Group.
  - figma: Dismissible
    code: dismissible
    kind: boolean
    notes: >-
      In Figma controls visibility of the close button and the backdrop's
      pointer-event affordance. In code drives Escape, backdrop-click,
      and close-button behavior.
  - figma: Scroll Behavior
    code: scrollBehavior
    kind: enum
    notes: inside / outside. Figma encodes the visual difference; code conditionally pins header/footer.

performance:
  - name: focusTrapAttachLatency
    metric: open-to-focus-bound
    threshold: 16
    unit: ms
    rationale: >-
      On modal open, the focus trap scans the dialog subtree for
      focusable descendants and binds the boundary tabbables. Above
      one frame (16 ms on a 60 Hz display), the open-to-focus-ready
      transition feels delayed — users perceive the modal as
      sluggish even when the enter-animation is fast. Sources:
      Radix Dialog and React Aria Modal both surface the focus-
      trap-attach as the first-paint-after-open hot path. Keep the
      tabbable scan O(focusable-descendants), not O(all-
      descendants); large form modals with many fields land near
      the threshold on commodity hardware.
  - name: inertSubtreeSize
    metric: descendant-node-count
    threshold: 5000
    unit: nodes
    rationale: >-
      On open, siblings of the modal portal-host receive `inert`
      (or `aria-hidden` plus `tabindex="-1"` on focusables in older
      browsers). The toggle traverses each subtree to update style
      / accessibility-tree state. Above ~5000 descendant nodes per
      subtree, a single frame budget cannot absorb the work and
      the modal-open animation drops frames. Source: WHATWG inert
      spec performance notes; Radix and Headless UI both document
      large-page modals as the slowest open path. Mitigation:
      portal the modal to body so siblings are limited to
      `<header>`, `<main>`, `<footer>` rather than deeply-nested
      content trees.
  - name: backdropOverdraw
    metric: viewport-coverage
    threshold: 1
    unit: viewports
    rationale: >-
      The backdrop is a full-viewport semi-transparent layer.
      Each additional stacked modal adds another full-viewport
      backdrop plus its own dialog subtree, multiplying the GPU
      composite cost per frame during enter / exit animations.
      Above one stacked backdrop (i.e. a second modal opened on
      top of the first), the canonical guidance is to redesign
      the flow rather than absorb the cost — modals should not
      stack per `whenToUse.avoid`. Threshold codifies the
      single-modal canon; the metric exists to flag stack-depth
      regressions in performance budgets.

a11yAcceptance:
  keyboardWalk:
    - keys: Tab
      expected: >-
        Focus moves to the next focusable inside the dialog. After the
        last focusable, focus cycles back to the first — never escapes
        into the page beneath the backdrop while the dialog is open.
    - keys: Shift+Tab
      expected: >-
        Focus moves to the previous focusable inside the dialog. From the
        first focusable, cycles to the last.
    - keys: 'Escape (when dismissible is true)'
      expected: >-
        Closes the dialog along the canonical `open → closing → closed`
        path; focus restores to the trigger that opened the dialog. When
        `dismissible: false` (e.g. an in-flight commit), Escape is a
        no-op.
    - keys: Enter (in form-style dialog)
      expected: >-
        Activates the default form action (commit) only when the focus is
        on a form element with implicit submission. Modal does not bind
        Enter at the container level — that would conflict with multi-line
        text inputs.
  announcements:
    - trigger: Dialog opens (`closed → opening → open`)
      expected: >-
        Once `aria-modal="true"` is set on the container and focus moves
        inside, the SR announces the dialog title (via `aria-labelledby`)
        followed by "dialog" — e.g. "Edit profile, dialog". The previous
        page context is silenced via `inert` on siblings.
    - trigger: Dialog closes (`open → closing → closed`)
      expected: >-
        Focus returns to the trigger; the trigger's accessible name and
        role are re-announced. No automatic announcement is required for
        the close itself — the focus restoration is the cue.
    - trigger: Alert dialog opens (alertdialog variant)
      expected: >-
        Same as dialog but with role `alertdialog`. SR announces
        "<title>, alert dialog"; the body content (referenced via
        `aria-describedby`) is read after the title.
  axeCoreVersion: '4.10.2'
  axeRules:
    - aria-dialog-name
    - aria-required-attr
    - aria-hidden-focus
    - color-contrast
    - focus-order-semantics
    - landmark-unique
    - duplicate-id-active

contracts:
  nonNegotiable:
    - rule: >-
        At most one modal is open at any moment. Stacking modals
        is non-canonical; patterns that feel like they require
        modal-on-modal redesign as a step flow within a single
        modal, or as a sequence of modal → dismiss → modal.
      source: canon
      consequence: >-
        Stacked modals fight for the focus trap, leak `inert`
        handling between layers, and confuse assistive tech that
        walks the modality tree. The "modality" contract becomes
        ambiguous and SR users lose track of which surface owns
        the next interaction.
    - rule: >-
        Focus is trapped inside the dialog while open, and
        restored to the previously-focused trigger on close. If
        the trigger no longer exists after the action, focus
        moves to a stable landmark (page heading, confirmation
        toast).
      source: apg
      sourceRef: 'APG: Dialog (Modal) pattern — Keyboard interaction'
      consequence: >-
        Without the trap, Tab leaks focus to controls hidden
        beneath the backdrop; without restore, keyboard and SR
        users land on `<body>` after dismissal and re-orient
        from the top of the page. Both are routinely shipped
        broken.
    - rule: >-
        The rest of the document is taken out of the AT and
        interaction tree via `inert` on siblings of the dialog
        portal — not via `aria-hidden="true"` on `<body>`.
      source: html-spec
      sourceRef: 'HTML inert attribute + ARIA dialog-modal pattern'
      consequence: >-
        Setting `aria-hidden` on `<body>` collapses the dialog
        itself out of the AT tree because the dialog typically
        descends from body. `inert` disables interaction without
        collapsing AT semantics, which is what the modality
        contract actually requires.
    - rule: >-
        Escape dismisses the dialog when `dismissible: true`,
        bound at the dialog (or document) level so the handler
        is identical across input modalities (Escape, close
        button, backdrop click).
      source: apg
      sourceRef: 'APG: Dialog (Modal) pattern — Escape key'
      consequence: >-
        Escape attached to the backdrop only fires when the
        backdrop receives the keystroke — almost never in
        practice. Keyboard users perceive the modal as
        non-dismissible and reach for the close button by mouse,
        breaking the keyboard-equivalence contract.

