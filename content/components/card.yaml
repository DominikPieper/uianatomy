id: card
name: Card
description: >-
  A bounded container that groups a coherent unit of content — typically a
  title, supporting body, optional media, and optional actions — and lifts
  it as a single perceivable object on the page.
intro: >-
  Card is a content-led container with hierarchical title, body,
  optional media, and action affordances — the workhorse of
  dashboards, content feeds, and grid layouts. Three structural
  variants (elevated, outlined, flat) cover the emphasis ladder;
  orientation toggles between vertical and horizontal layouts;
  the interactive property turns the whole surface into a single
  activator via the overlay pattern. The reference documents the
  slot anatomy, the click-handler contract, the variant-vs-state
  distinction that recurs in Figma drift, and the
  cross-framework expression of card-as-link.

whenToUse:
  use: >-
    When grouping a coherent unit of content — title plus body plus
    optional media plus optional actions — that should perceive as a
    single object on the page. Typical hosts: dashboards, marketing
    grids, search results, content collections.
  avoid: >-
    For dense list rows where every row is structurally identical
    and visual separation is purely a horizontal rule — that is
    `ListItem`. For decorative content tiles in a grid where each
    tile is primarily an image with a label — `Tile`. For announcing
    transient information — `Banner` or `Toast`.
  vsRelated:
    - id: tile
      difference: >-
        `Tile` is image-led with minimal supporting text; `Card` is
        content-led with hierarchical title plus body plus media. A
        wall of Tiles reads as a gallery; a wall of Cards reads as a
        feed.
    - id: list-item
      difference: >-
        `ListItem` lives inside an explicit `<ul>` or `<ol>` and
        cooperates with sibling rows for keyboard navigation and
        selection semantics. `Card` is a standalone object with no
        implicit sibling relationship.
    - id: table
      difference: >-
        A wall of `Card` reads as a feed of independent records,
        each consumed as a standalone unit (a product, a profile);
        `Table` presents the same records as scannable rows so
        users compare attributes across many records. Use Table
        for inventory / contacts / transactions where the
        cross-row attribute comparison is the primary task; use
        Card when each record is consumed on its own and the
        comparison is incidental. The decision test: does the
        user scan attributes across rows (Table) or consume
        each record's hierarchy independently (Card)?

anatomy:
  - id: media
    required: false
    purpose: >-
      Visual representation associated with the card's subject. Typically
      full-bleed at the top (or leading edge in horizontal orientation) to
      anchor scanning before the title.
    slotKind: content
    layout:
      row: 1
      col: 1
      span: full
      aspect: '16:9'
    figma:
      type: frame
      hint: Aspect-ratio-locked frame; image fill or instance swap
    code:
      slot: media
      semantic: img-or-video
    a11y:
      hint: >-
        Provide alt text for informative images; alt="" for purely decorative
        media. Do not duplicate the title in alt text.
    tokens:
      radius:
        corner: radius.md

  - id: eyebrow
    required: false
    purpose: >-
      Short categorical label sitting above the title (kicker, tag, or
      timestamp). Establishes context before the headline.
    slotKind: content
    layout:
      row: 2
      col: 1
      span: full
    figma:
      type: text
      hint: Text style "Eyebrow" / "Overline"; uppercase or small-caps
    code:
      slot: eyebrow
      semantic: text-with-role-or-tag
    a11y:
      hint: >-
        Avoid heading semantics — the eyebrow is metadata, not a heading.
        If grouped with the title, treat as part of the same labelling
        relationship via aria-labelledby.
    tokens:
      typography:
        size: text.xs
        weight: weight.medium
        tracking: tracking.wide
      color:
        foreground: color.text.muted

  - id: title
    required: true
    purpose: >-
      The card's primary identifier. Should be readable as a standalone
      label outside of the card's context (e.g., when surfaced in a list of
      results).
    slotKind: content
    layout:
      row: 3
      col: 1
      span: full
    figma:
      type: text
      hint: Heading text style; bound to a component property for content
    code:
      slot: title
      semantic: heading-or-link
    a11y:
      hint: >-
        Use a heading element of the appropriate level for the surrounding
        document outline. If the card is interactive as a whole, the title
        also carries the accessible name of the activator.
    tokens:
      spacing:
        blockPadding: spacing.tight
      typography:
        size: text.lg
        weight: weight.semibold
        lineHeight: leading.tight
      color:
        foreground: color.text.primary

  - id: subtitle
    required: false
    purpose: >-
      Secondary descriptor below the title, narrowing or clarifying its
      meaning. Not a place for body prose.
    slotKind: content
    layout:
      row: 4
      col: 1
      span: full
    figma:
      type: text
      hint: Subtitle text style; lighter weight than title
    code:
      slot: subtitle
      semantic: text
    a11y:
      hint: >-
        If the subtitle qualifies the title's meaning, associate it via
        aria-describedby on the interactive element.
    tokens:
      typography:
        size: text.sm
        weight: weight.regular
        lineHeight: leading.snug
      color:
        foreground: color.text.muted

  - id: body
    required: true
    purpose: >-
      Supporting prose, summary, or structured content. The card's payload.
    slotKind: content
    layout:
      row: 5
      col: 1
      span: full
    figma:
      type: text-or-frame
      hint: Auto-layout text frame, or nested component instance for richer payloads
    code:
      slot: body
      semantic: prose-or-children
    a11y:
      hint: >-
        Body content keeps its native semantics (lists stay lists, links
        stay links). Avoid wrapping body in role="text" — it strips
        semantics from assistive tech.
    tokens:
      spacing:
        blockPadding: spacing.compact
      typography:
        size: text.md
        lineHeight: leading.normal
      color:
        foreground: color.text.primary

  # P6-126 / ADR-030 — actions slot is the canonical action-group
  # sub-anatomy. Card caps at two actions; tertiary is omitted. The
  # primary-action override re-states the Card-specific a11y rule about
  # nested buttons interacting with card-as-link overlays.
  - $ref: action-group
    row: 6
    overrides:
      - slot: tertiary-action
        type: omitted
        rationale: >-
          Card actions are canonically capped at 2; tertiary belongs in
          a Menu when present.
      - slot: primary-action
        type: overridden
        rationale: >-
          Re-state Card-specific guidance: nested buttons must remain
          keyboard-reachable; card-as-link overlays demand the
          card-as-link-nested-buttons pattern.
        a11y:
          hint: >-
            Real button with accessible name. First in DOM order; visual
            position is inline-end via logical properties so RTL mirroring
            is automatic. If the whole card is also clickable, see mistake
            "card-as-link-nested-buttons" for the correct overlay pattern.

  - id: footer
    required: false
    purpose: >-
      Tertiary metadata below the actions (e.g., timestamps, status chips,
      author attribution). Lower visual weight than actions.
    slotKind: structural
    layout:
      row: 7
      col: 1
      span: full
    figma:
      type: frame
      hint: Auto-layout horizontal frame; smaller text style
    code:
      slot: footer
      semantic: contentinfo-region
    a11y:
      hint: >-
        Footer content is not the card's accessible name. If it carries
        status, use aria-live on the chip itself, not the card.
    tokens:
      spacing:
        padding: spacing.compact
        gap: spacing.tight
      typography:
        size: text.xs
      color:
        foreground: color.text.muted

axes:
  variants:
    - name: elevated
    - name: outlined
    - name: flat
  properties:
    - {name: interactive, kind: primitive, of: boolean}
    - name: orientation
      kind: enum
      values: [vertical, horizontal]
    - name: density
      kind: enum
      values: [comfortable, compact]
  states:
    interactive:
      - hover
      - focus-visible
      - active
      - disabled
    data:
      - selected
      - loading

mismatches:
  - figma: Variants for hover / focus / active / disabled
    code: CSS pseudo-classes (:hover, :focus-visible, :active) and aria/disabled attributes
    consequence: >-
      Variant explosion in Figma (3 variants × 4 states × 2 orientations ×
      2 densities = 48+ component variants), and the developer cannot map
      a Figma "hover variant" to a CSS pseudo-class without manual
      translation.
    correct: >-
      Treat interactive states as a separate spec (a "states" sheet or
      component property documentation) — not as Figma variants. Variants
      are reserved for structurally different versions (elevated /
      outlined / flat).

  - figma: Media-on-top vs. media-on-leading-edge expressed as separate variants
    code: A single component with an `orientation` prop ('vertical' | 'horizontal')
    consequence: >-
      Designers and developers count card variants differently. Designers
      see 6+ variants; developers see 3 variants × 2 orientations.
      Implementation drift: designer adds a third orientation in Figma but
      the prop type is a binary union.
    correct: >-
      Model orientation as a *property*, not a variant. Document the
      property in Figma using a component property of type 'variant' that
      *only* captures orientation, separate from visual variants.

  - figma: A clickable card built by stacking a "card" component on top of an invisible "button" component
    code: An <a>/<button> wrapping the entire card (or a pseudo-element overlay pattern)
    consequence: >-
      The Figma artifact does not encode the affordance — designers may
      not realise the whole card must be a single accessible activator,
      and developers may forget the keyboard story when implementing.
    correct: >-
      When the card is interactive as a whole, model the activator as an
      explicit boolean property (`interactive`) on the canonical
      component. Render it as a single anchor or button with the rest of
      the card visually inside, using the overlay pattern to keep nested
      controls reachable.

  - figma: Selected state expressed via an "outline + filled background" variant
    code: A `data-selected` or `aria-selected` attribute toggled by the application
    consequence: >-
      The selection style is duplicated in two places (variant + CSS) and
      inevitably drifts. Worse, treating selection as a variant blocks
      multi-state selection (e.g., selected + disabled).
    correct: >-
      Document selection as a *data state*, not a variant. The visual
      treatment is described once and is composable with the interactive
      states.

mistakes:
  - id: card-as-link-nested-buttons
    severity: blocker
    title: Card-as-link with nested action buttons
    description: >-
      Wrapping the whole card in an <a> turns the entire surface into a
      single tab stop and traps nested buttons — keyboard users cannot
      activate the inner controls, and screen readers announce the nested
      buttons as part of the link's name.
    fix: >-
      Use the pseudo-element overlay pattern: keep the card as a regular
      container, give the title a real <a> with `::before` covering the
      whole card via absolute positioning, and let nested actions sit on
      a higher stacking context (z-index) so clicks on them aren't
      intercepted. The link receives the card's accessible name from the
      title.

  - id: clickable-card-no-keyboard
    severity: blocker
    title: Click handler on the card without a focusable activator
    description: >-
      Attaching a click handler to a <div> card with no <a> or <button>
      inside makes the card unreachable by keyboard and unannounceable
      to assistive tech.
    fix: >-
      Always anchor the activation on a real interactive element
      (<a href> for navigation, <button> for in-page actions). If the
      visual treatment requires the whole card to look clickable, use
      the overlay pattern — never role="button" on the card div.

  - id: variant-explosion-from-states
    severity: minor
    title: Modelling interactive states as Figma variants
    description: >-
      Adding hover / focus / active / disabled as variants in Figma
      causes the variant matrix to explode and forces the developer to
      hand-translate Figma variants into CSS pseudo-classes.
    fix: >-
      Document interactive states once in a separate "states" sheet or
      component documentation. Reserve Figma variants for structurally
      different versions (elevated / outlined / flat). Document the same
      separation in the canonical reference and the production library.

  - id: media-alt-duplicates-title
    severity: minor
    title: Image alt text repeats the card title
    description: >-
      Setting `alt` to the title text causes screen readers to announce
      the title twice when the card is interactive — once as the link
      name and once as the image alt.
    fix: >-
      For decorative / supporting media use `alt=""`. For media that
      carries information not in the title, write alt that adds the
      missing information ("Chart showing 12% YoY growth"), not a
      restatement of the headline.

frameworkMap:
  webComponents:
    structureMechanism: named slots (<slot name="media">, <slot name="title">, …)
    variantMechanism: attributes reflected to properties (variant="elevated", orientation="horizontal")
  react:
    structureMechanism: compound components (Card.Media, Card.Title, Card.Body, …) or explicit slot props
    variantMechanism: props with class-variance-authority / tailwind-variants for the variant/property axis
  angularSignals:
    structureMechanism: ng-content with select="[card-media]" / [card-title] etc., and signal-based input() for slots
    variantMechanism: input<'elevated' | 'outlined' | 'flat'>() and input<'vertical' | 'horizontal'>()
  vue:
    structureMechanism: named slots (<slot name="media" />, <slot name="title" />, …)
    variantMechanism: defineProps with literal-union types

responsive:
  breakpoints:
    - at: breakpoint.sm
      change: >-
        At and below, the `horizontal` orientation collapses to vertical
        regardless of the prop — media stacks above body, the leading-edge
        layout cannot survive narrow viewports without truncating either
        the image aspect or the body's measure. Media aspect relaxes from
        16:9 to 4:3 for better thumb-scroll density.
    - at: breakpoint.md
      change: >-
        Above this width, the `orientation` property is honoured as
        authored. Density `compact` becomes the default for cards rendered
        in multi-column grids; `comfortable` for full-width detail cards.

i18n:
  rtl:
    mirroring: >-
      Horizontal-orientation cards flip their leading-edge media to the
      right side via logical `inline-start` properties. Eyebrow / title /
      subtitle / body inherit document direction; numerals and dates
      should follow the locale's preferred numeral system. Action button
      order reverses: the primary action moves from inline-end (right in
      LTR) to inline-end (left in RTL) — the *logical* position is
      unchanged, the visual position mirrors. Decorative media that
      carries directionality (left-pointing arrow icons, before/after
      photo pairs) needs explicit alt-text or composition handling.
  textExpansion: >-
    Title is clamped to 2 lines (`-webkit-line-clamp: 2`) by canonical
    convention; subtitle to 3; body free-flow. Eyebrow may wrap to a
    second line under heavy expansion (DE/RU). Action labels follow
    Button's expansion rules. Multi-column card grids may need to
    re-flow at narrower widths for languages with longer-than-average
    text.

propertyMap:
  - figma: Variant
    code: variant
    kind: enum
    notes: Maps elevated / outlined / flat.
  - figma: Orientation
    code: orientation
    kind: enum
    notes: vertical / horizontal — Figma encodes as a separate Variant property, not bundled with the visual variant.
  - figma: Density
    code: density
    kind: enum
  - figma: Interactive
    code: interactive
    kind: boolean
    notes: >-
      Toggles the card-as-link overlay pattern. In Figma it controls
      hover state visibility; in code it conditionally wraps the card
      surface with the interactive activator.
  - figma: Has Media
    code: media
    kind: boolean
    notes: Slot-visibility toggle; code conditionally renders the media slot.
  - figma: Media
    code: media
    kind: slot
    notes: Swaps the media component instance (image, video, iframe).
  - figma: Has Eyebrow
    code: eyebrow
    kind: boolean
  - figma: Eyebrow
    code: eyebrow
    kind: text
  - figma: Title
    code: title
    kind: text
  - figma: Has Subtitle
    code: subtitle
    kind: boolean
  - figma: Subtitle
    code: subtitle
    kind: text
  - figma: Body
    code: body
    kind: text
    notes: For non-prose bodies, Figma uses an Instance Swap on a 'Body Slot' instead.
  - figma: Has Actions
    code: actions
    kind: boolean
  - figma: Has Footer
    code: footer
    kind: boolean
a11yAcceptance:
  keyboardWalk:
    - keys: Tab
      expected: >-
        For non-interactive cards, focus skips the card surface and lands
        on nested interactive elements (buttons, links inside actions or
        the body) in document order. For `interactive: true` cards using
        the overlay pattern, the title's `<a>` is the single tab stop for
        the card; nested actions remain individually reachable on
        subsequent Tab presses (kept on a higher stacking context).
    - keys: Enter (on overlay link)
      expected: >-
        Activates the card-as-link target. Spacebar does not activate —
        anchors are Enter-only by native convention.
  announcements:
    - trigger: Focus enters card-as-link
      expected: >-
        The title's accessible name followed by "link" (e.g. "Q3 revenue
        report, link"). The eyebrow, subtitle, and body are not part of
        the link's accessible name unless explicitly tied via
        `aria-labelledby`.
    - trigger: '`selected` data state set'
      expected: >-
        Selection is announced via `aria-selected="true"` on the card's
        primary actionable element. SR reads "selected" before the
        accessible name (varies slightly by SR).
  axeCoreVersion: '4.10.2'
  axeRules:
    - link-name
    - color-contrast
    - heading-order
    - image-alt

motion:
  reducedMotionFallback: instant
  durations:
    hoverLift: motion.duration.fast
    selectToggle: motion.duration.fast
  easing: motion.easing.standard

events:
  - name: clickActivate
    optional: true
    payload: >-
      `{ cardId: string }`. Fires when the user activates the
      card (click on `interactive: true` variant, Enter on the
      keyboard-focused activator). For cards wrapping a
      navigation anchor, the consumer's router handles
      navigation and this event is informational. Only canonical
      when `interactive: true`.
    frameworkNotes:
      webComponents: >-
        `clickActivate` CustomEvent on the host with
        `event.detail = { cardId }`.
      react: >-
        `onClick(event)` standard DOM event on the activator;
        `onActivate(cardId)` when consumers prefer the canonical
        event shape over the per-element click.
      angularSignals: >-
        `output<string>('clickActivate')`.
      vue: >-
        `@click-activate` event with payload `{ cardId }`.

  - name: selectedChange
    optional: true
    payload: >-
      `{ cardId: string, selected: boolean }`. Fires when the
      card's `selected` data state flips — typically via a
      checkbox or whole-card-click on selectable cards or by
      programmatic change. Only canonical when the consumer is
      using cards as a selectable collection.
    frameworkNotes:
      webComponents: >-
        `selectedChange` CustomEvent with
        `event.detail = { cardId, selected }`.
      react: >-
        `onSelectedChange(selected: boolean)` per-card callback
        or aggregated `onSelectionChange(set: Set<string>)` at
        the grid wrapper.
      angularSignals: >-
        `output<{ cardId: string, selected: boolean }>('selectedChange')`.
      vue: >-
        `@update:selected` on the card or `@update:selection`
        on the grid wrapper.

performance:
  - name: cardsPerViewportDesktop
    metric: visible-card-count
    threshold: 30
    unit: cards
    rationale: >-
      Above ~30 cards visible simultaneously at typical desktop
      widths the surface ceases to read as a feed and becomes a
      grid; consumers should switch to `Tile` (image-led grid
      semantics) or paginate. Card optimises for ~10–30 visible
      at typical content-feed densities.
  - name: mediaLazyLoadThreshold
    metric: viewport-distance
    threshold: 200
    unit: px
    rationale: >-
      Cards with media inside the viewport (and within ~200 px
      of viewport edges) load eagerly; further cards lazy-load
      via `loading="lazy"` on the image element or
      IntersectionObserver-driven loading. Same canonical buffer
      as Tile to keep the LCP-vs-bandwidth trade-off consistent
      across image-bearing components.
  - name: perCardPaintBudget
    metric: paint-time
    threshold: 16
    unit: ms
    rationale: >-
      Each card aims to paint in under one 60 Hz frame. Cards
      with elaborate hover/elevation transitions, parallax media,
      or expensive shadow filters routinely exceed this on long
      feeds and produce jank during fast scroll. Designers
      compose the elevated variant within this budget.

contracts:
  vocabularyDrift:
    - system: Material 3
      theirTerm: Card
      note: >-
        Material 3 picks `elevated` and `outlined` as canonical
        variants matching this canon; `flat` does not appear in
        Material's roster but ships in Polaris and Atlassian as
        a low-emphasis variant.
    - system: Polaris
      theirTerm: Card
      note: >-
        Polaris ships a Card primitive with built-in section
        slots (`Card.Section`) — finer-grained than the
        canonical anatomy's body slot. The composite contract
        matches; the slot granularity differs.
    - system: Carbon
      theirTerm: Tile (selectable / clickable)
      note: >-
        Carbon labels its content-led card primitive "Tile",
        producing terminology collision with this canon's image-
        led `Tile`. Implementation audits document the
        per-library naming via `componentName` and the
        contract-vs-naming distinction matters because
        Carbon-Tile ≈ canonical-Card, not canonical-Tile.
    - system: Atlassian
      theirTerm: Card
      note: >-
        Atlassian's Card matches the canonical content-led
        contract; the elevated / outlined / flat axis maps to
        Atlassian's `appearance` prop.

sources:
  - https://www.w3.org/WAI/ARIA/apg/patterns/
  - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/article
  - url: https://polaris-react.shopify.com/components/layout-and-structure/card
    library: polaris
    verifiedAt: '2026-05-05'
  - url: https://carbondesignsystem.com/components/tile/usage/
    library: carbon
    verifiedAt: '2026-05-05'
  - url: https://m3.material.io/components/cards/overview
    library: material3
    verifiedAt: '2026-05-05'
  - url: https://www.radix-ui.com/themes/docs/components/card
    library: radix
    verifiedAt: '2026-05-05'
  - https://inclusive-components.design/cards/

lastReviewed: '2026-05-05'
rules:
  - id: interactive-true-cards-activator-single-real
    statement: >-
      When `interactive: true`, the card's activator is a single
      real `<a href>` (navigation) or `<button>` (in-page action)
      — never a `<div onclick>` and never `role="button"` on the
      card root. See mistakes `card-as-link-nested-buttons` and
      `clickable-card-no-keyboard` for the overlay-pattern
      construction that keeps nested actions reachable.
    source: html-spec
    sourceRef: 'HTML interactive element semantics + WAI-ARIA Authoring Practices'
    consequence: >-
      Wrapping the entire card in `<a>` traps nested buttons —
      keyboard users cannot activate inner controls, and SR
      reads the nested buttons as part of the link's
      accessible name. `<div onclick>` makes the card
      unfocusable and unannounceable. The overlay pattern is
      the only construction that keeps both the
      whole-card-clickable affordance and the nested-actions
      contract.
  - id: card-tile-listitem-distinct-canonical-ids
    statement: >-
      `Card`, `Tile`, and `ListItem` are distinct canonical ids
      with non-overlapping required anatomy — Card mandates
      `title` and `body` as content slots. A composition that
      drops both in favor of a single dominant image, or
      reflows into a horizontal leading/primary/secondary/
      trailing row, is not a Card variant — it is Tile's or
      ListItem's contract. See `whenToUse.vsRelated` (`tile`,
      `list-item`) for the full differentiation and decision
      test.
    source: canon
    consequence: >-
      Mixing the three contracts produces composite components
      that read incoherently — text-heavy "tiles" lose the
      gallery-scan affordance; image-led "cards" force
      designers to invent media-dominant variants the canon
      does not endorse; row-style cards collapse the
      list/grid distinction that drives layout choice.
  - id: interactive-states-hover-focus-visible-active
    statement: >-
      Interactive states (hover / focus-visible / active /
      disabled) are never modelled as Figma variants; variants
      are reserved for structurally different versions
      (`elevated` / `outlined` / `flat`). See mistake
      `variant-explosion-from-states` for the variant-matrix
      failure mode and the states-sheet fix.
    source: canon
    consequence: >-
      Modelling states as variants explodes the matrix
      (3 variants × 4 interactive states × 2 orientations × 2
      densities = 48+ Figma variants) and forces designers
      and developers to translate the variant matrix into
      pseudo-classes by hand on every implementation. The
      anatomy splits intentionally to keep both surfaces
      small.
