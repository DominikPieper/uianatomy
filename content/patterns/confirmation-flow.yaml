notes: >-
  This is the first canonical pattern entry. Prose was triangulated
  against APG (alertdialog role), Radix, Headless UI, CDK, Polaris,
  and Material 3 documentation. The decision and mistake claims trace
  to the APG alertdialog pattern and WCAG 3.3.4 (Error Prevention).
  Library APIs change; re-validate the framework skeletons against
  current docs before citing them in production reviews.
